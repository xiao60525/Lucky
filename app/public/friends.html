<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f4f5f9" />
<meta name="robots" content="noindex, nofollow" />
<title>好友消息</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg:#f4f5f9; --card:#fff; --text:#10131c; --muted:#8b91a1; --line:#edeff5;
    --accent:#5a5cf0; --accent2:#8b5cf6; --danger:#f05252; --ok:#12b981;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.dark {
    --bg:#12141c; --card:#1c1f2b; --text:#e9ecf5; --muted:#8b93a7; --line:#262a38;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
    display:flex; justify-content:center; overflow:hidden;
  }
  button, input, textarea { font-family:inherit; font-size:inherit; color:inherit; }
  button { border:0; background:none; cursor:pointer; }
  [hidden] { display:none !important; }

  .page {
    position:relative; width:100%; max-width:430px; height:100dvh;
    background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
  }
  @media (min-width:480px) and (min-height:700px) {
    body { align-items:center; background:#e6e8f0; }
    .page { height:min(880px,95dvh); border-radius:34px; box-shadow:0 24px 70px rgba(15,20,40,.18); }
  }
  body.dark { background:#0c0e14; }

  /* ---------- 顶栏 ---------- */
  .top {
    flex:none; display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
    background:var(--card); border-bottom:1px solid var(--line);
  }
  .back {
    flex:none; width:34px; height:34px; border-radius:12px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .back:active { transform:scale(.94); }
  .who { flex:1; min-width:0; }
  .who b { display:block; font-size:17px; font-weight:650; line-height:1.2; }
  .who i { font-style:normal; font-size:11.5px; color:var(--muted); }
  .top-btn {
    flex:none; height:32px; padding:0 12px; border-radius:11px; font-size:13px; font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  }
  .top-btn:active { transform:scale(.96); }

  /* ---------- 分段 ---------- */
  .tabs { flex:none; display:flex; gap:8px; padding:10px 14px 4px; background:var(--card); }
  .tab {
    position:relative; padding:7px 14px; border-radius:12px; font-size:13.5px; font-weight:600;
    color:var(--muted); background:transparent;
  }
  .tab.on { color:var(--text); background:var(--bg); box-shadow:inset 0 0 0 1px var(--line); }
  .tab em {
    font-style:normal; display:inline-block; min-width:16px; height:16px; line-height:16px; padding:0 4px;
    margin-left:4px; border-radius:9px; background:var(--danger); color:#fff; font-size:10.5px; text-align:center;
  }

  /* ---------- 列表 ---------- */
  .list { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 10px calc(18px + var(--safe-bottom)); }
  .row {
    width:100%; display:flex; align-items:center; gap:11px; padding:11px 10px; border-radius:15px;
    background:transparent; text-align:left;
  }
  .row:active { background:var(--card); }
  .ava {
    flex:none; width:44px; height:44px; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:16px; font-weight:600;
  }
  .ava.has-img { background:#dde1ec; }
  .ava img { width:100%; height:100%; object-fit:cover; display:block; }
  .row-txt { flex:1; min-width:0; }
  .row-txt b { display:flex; align-items:center; gap:5px; font-size:15px; font-weight:600; }
  .row-txt b span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-chip { flex:none; font-size:9.5px; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:0 3px; line-height:1.4; }
  .row-txt i {
    display:block; font-style:normal; font-size:12.5px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-meta { flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .row-meta em { font-style:normal; font-size:11px; color:var(--muted); }
  .badge {
    min-width:17px; height:17px; line-height:17px; padding:0 5px; border-radius:9px;
    background:var(--danger); color:#fff; font-size:10.5px; font-weight:600; text-align:center;
  }
  .badge.zero { display:none; }
  .badge.dot { min-width:9px; width:9px; height:9px; padding:0; border-radius:50%; }

  .empty { padding:56px 26px; text-align:center; color:var(--muted); }
  .empty .big { font-size:42px; line-height:1; margin-bottom:12px; }
  .empty p { margin:0 0 16px; font-size:13.5px; }
  .section-note { font-size:12px; color:var(--muted); padding:12px 6px 2px; }

  /* 从商品页带过来的「分享给好友」提示条 */
  .share-bar {
    flex:none; display:flex; align-items:center; gap:8px; margin:8px 12px 0; padding:10px 12px;
    border-radius:13px; background:#eef0ff; color:#4a4cd6; font-size:12.5px; line-height:1.4;
  }
  .share-bar b { font-weight:650; }
  .share-bar button { margin-left:auto; flex:none; color:#4a4cd6; font-size:12px; opacity:.75; }
  body.dark .share-bar { background:rgba(90,92,240,.16); color:#b6b8ff; }
  body.dark .share-bar button { color:#b6b8ff; }

  /* ---------- 申请卡片 ---------- */
  .req-card { background:var(--card); border-radius:16px; padding:12px; margin:8px 4px; }
  .req-head { display:flex; align-items:center; gap:10px; }
  .req-head .ava { width:40px; height:40px; font-size:15px; }
  .req-head b { flex:1; min-width:0; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .req-head em { font-style:normal; font-size:11.5px; color:var(--muted); }
  .req-acts { display:flex; gap:8px; margin-top:10px; }
  .btn-mini {
    flex:1; height:34px; border-radius:11px; font-size:13px; font-weight:600; border:1px solid var(--line);
  }
  .btn-mini.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent; }
  .btn-mini.ghost { color:var(--muted); }
  .btn-mini:active { transform:scale(.97); }

  /* ---------- 聊天面板 ---------- */
  .chat {
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    background:var(--bg); transform:translateX(100%); transition:transform .22s ease;
    pointer-events:none;
  }
  .chat.show { transform:translateX(0); pointer-events:auto; }
  .chat .top { border-bottom:1px solid var(--line); }
  .chat-who { flex:1; min-width:0; text-align:center; }
  .chat-who b { display:block; font-size:15.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-who i { font-style:normal; font-size:11px; color:var(--muted); }
  .msgs { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 12px 6px; }
  .day { text-align:center; font-size:11px; color:var(--muted); margin:10px 0 12px; }
  .line { display:flex; gap:8px; margin-bottom:12px; align-items:flex-end; }
  .line.me { flex-direction:row-reverse; }
  .line .ava { width:32px; height:32px; font-size:13px; }
  .bubble {
    max-width:72%; padding:9px 12px; border-radius:14px; font-size:14.5px; line-height:1.5;
    background:var(--card); border:1px solid var(--line); word-break:break-word; white-space:pre-wrap;
  }
  .line.me .bubble {
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;
  }
  .line.pending .bubble { opacity:.65; }
  .chat-empty { text-align:center; color:var(--muted); font-size:12.5px; padding:30px 20px; }

  /* 图片气泡 */
  .bubble.media { padding:3px; background:var(--card); border:1px solid var(--line); }
  .line.me .bubble.media { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; }
  .bubble.media img { display:block; max-width:186px; max-height:250px; border-radius:11px; }

  /* 商品卡片气泡 */
  .pcard {
    width:206px; max-width:72vw; border-radius:14px; overflow:hidden; text-align:left;
    background:var(--card); border:1px solid var(--line);
  }
  .pcard-thumb {
    display:block; width:100%; height:112px; background:#e9ecf5 center/cover no-repeat;
  }
  .pcard-thumb.ph { display:flex; align-items:center; justify-content:center; font-size:32px; }
  .pcard-body { padding:9px 10px 10px; }
  .pcard-body b {
    display:block; font-size:13.5px; font-weight:600; line-height:1.35;
    max-height:2.7em; overflow:hidden;
  }
  .pcard-price { display:flex; align-items:baseline; gap:6px; margin-top:6px; }
  .pcard-price em { font-style:normal; color:#f05252; font-weight:700; font-size:15.5px; }
  .pcard-price span { margin-left:auto; font-size:11px; color:var(--muted); }
  .line.me .pcard-price span { color:var(--muted); }

  /* 转账卡片气泡 */
  .tcard {
    width:206px; max-width:72vw; border-radius:14px; padding:12px 13px; text-align:left; color:#fff;
    background:linear-gradient(135deg,#ff9f43,#ff7043);
  }
  .tcard .t1 { font-size:11.5px; opacity:.94; }
  .tcard .t2 { font-size:21px; font-weight:700; margin:3px 0 4px; letter-spacing:.3px; }
  .tcard .t3 { font-size:11.5px; opacity:.94; line-height:1.45; min-height:1em; }
  .tcard .t4 {
    margin-top:8px; padding-top:6px; font-size:10.5px; opacity:.88;
    border-top:1px solid rgba(255,255,255,.3);
  }
  .tcard.is-done { background:linear-gradient(135deg,#b9bfd0,#a4abbd); }
  .tcard.is-ok { background:linear-gradient(135deg,#3ec98b,#1fae7a); }
  .tcard-acts { display:flex; gap:8px; margin-top:10px; }
  .tcard-btn {
    flex:1; height:32px; border-radius:10px; font-size:13px; font-weight:600;
    background:#fff; color:#e2651b;
  }
  .tcard-btn.ghost { background:rgba(255,255,255,.22); color:#fff; }
  .tcard-btn:disabled { opacity:.6; }
  .tcard-btn:active { transform:scale(.97); }

  /* 待收款提示条 */
  .tf-strip {
    display:flex; align-items:center; gap:10px; margin:10px 12px 4px; padding:12px 13px;
    border-radius:15px; text-align:left; width:calc(100% - 24px);
    background:linear-gradient(135deg,#fff4e6,#ffece0); border:1px solid #ffd9b8;
  }
  .tf-strip .tf-ic { font-size:20px; }
  .tf-strip .tf-txt { flex:1; min-width:0; }
  .tf-strip .tf-txt b { display:block; font-size:13.5px; font-weight:650; color:#a8500f; }
  .tf-strip .tf-txt i { font-style:normal; font-size:11.5px; color:#b57a44; }
  .tf-strip .tf-go { font-size:12.5px; font-weight:600; color:#e2651b; }
  .tf-strip:active { transform:scale(.99); }

  /* 待收款弹层 */
  .tf-list { overflow-y:auto; max-height:60vh; }
  .tf-item { display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); }
  .tf-item:last-child { border-bottom:0; }
  .tf-item .ava { width:40px; height:40px; font-size:15px; }
  .tf-info { flex:1; min-width:0; }
  .tf-info b { display:block; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tf-info i { font-style:normal; font-size:11.5px; color:var(--muted); }
  .tf-amt { flex:none; font-size:15px; font-weight:700; color:#e2651b; }
  .tf-btns { flex:none; display:flex; gap:6px; }
  .tf-btns button {
    height:30px; padding:0 11px; border-radius:10px; font-size:12.5px; font-weight:600;
    border:1px solid var(--line); color:var(--text);
  }
  .tf-btns button.primary { border-color:transparent; color:#fff; background:linear-gradient(135deg,#ff9f43,#ff7043); }
  .tf-btns button:disabled { opacity:.55; }

  .composer {
    flex:none; display:flex; align-items:flex-end; gap:8px; padding:10px 12px;
    background:var(--card); border-top:1px solid var(--line);
  }
  .plus {
    flex:none; width:38px; height:38px; border-radius:13px; border:1px solid var(--line);
    background:var(--bg); color:var(--muted); font-size:19px; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:transform .15s;
  }
  .plus.on { transform:rotate(45deg); color:#fff; border-color:transparent; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .composer textarea {
    flex:1; min-height:38px; max-height:110px; padding:9px 12px; border-radius:13px; border:1px solid var(--line);
    background:var(--bg); resize:none; outline:none; font-size:14.5px; line-height:1.4;
  }
  .send {
    flex:none; height:38px; padding:0 16px; border-radius:13px; font-size:14px; font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  }
  .send:disabled { opacity:.55; }
  .send:active { transform:scale(.96); }

  /* ---------- 输入框扩展面板 ---------- */
  .panel {
    flex:none; display:none; background:var(--card); border-top:1px solid var(--line);
    padding:12px 12px calc(12px + var(--safe-bottom));
  }
  .panel.show { display:block; }
  .panel-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tool {
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px 9px;
    border-radius:14px; background:var(--bg); border:1px solid var(--line);
    font-size:11.5px; color:var(--muted);
  }
  .tool i { font-style:normal; font-size:21px; line-height:1; }
  .tool:active { transform:scale(.96); }
  .emoji-row { display:none; flex-wrap:wrap; gap:6px; margin-top:10px; max-height:132px; overflow-y:auto; }
  .emoji-row.show { display:flex; }
  .emoji-row button {
    width:38px; height:38px; border-radius:11px; background:var(--bg); border:1px solid var(--line); font-size:19px;
  }

  /* ---------- 弹层 ---------- */
  .sheet-mask {
    position:absolute; inset:0; background:rgba(10,12,20,.42); z-index:30; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .sheet-mask.show { opacity:1; pointer-events:auto; }
  .sheet {
    position:absolute; left:0; right:0; bottom:0; z-index:31; max-height:86%;
    background:var(--card); border-radius:22px 22px 0 0; padding:16px 14px calc(16px + var(--safe-bottom));
    transform:translateY(102%); transition:transform .24s cubic-bezier(.3,.9,.3,1);
    display:flex; flex-direction:column; gap:12px;
  }
  .sheet.show { transform:translateY(0); }
  .sheet h3 { margin:0; font-size:16px; font-weight:650; display:flex; align-items:center; }
  .sheet h3 button { margin-left:auto; font-size:13px; color:var(--muted); }
  .search { display:flex; gap:8px; }
  .search input {
    flex:1; height:40px; padding:0 13px; border-radius:13px; border:1px solid var(--line);
    background:var(--bg); outline:none; font-size:14.5px;
  }
  .search button {
    flex:none; padding:0 16px; height:40px; border-radius:13px; font-weight:600; font-size:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  }
  .hint { font-size:12px; color:var(--muted); line-height:1.5; }
  .results { overflow-y:auto; min-height:80px; }
  .res {
    display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line);
  }
  .res:last-child { border-bottom:0; }
  .res .ava { width:40px; height:40px; font-size:15px; }
  .res-txt { flex:1; min-width:0; }
  .res-txt b { display:block; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .res-txt i { font-style:normal; font-size:11.5px; color:var(--muted); }
  .res-btn {
    flex:none; height:32px; padding:0 13px; border-radius:11px; font-size:13px; font-weight:600;
    border:1px solid var(--line); color:var(--text);
  }
  .res-btn.add { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent; }
  .res-btn.done { color:var(--muted); }

  /* 商品选择 */
  .pk-list { overflow-y:auto; min-height:100px; max-height:52vh; }
  .pk-item { display:flex; gap:10px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line); width:100%; text-align:left; }
  .pk-item:last-child { border-bottom:0; }
  .pk-thumb {
    flex:none; width:46px; height:46px; border-radius:10px; background:#e9ecf5 center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .pk-txt { flex:1; min-width:0; }
  .pk-txt b { display:block; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pk-txt i { font-style:normal; font-size:12.5px; color:#f05252; font-weight:600; }
  .pk-send {
    flex:none; height:30px; padding:0 12px; border-radius:10px; font-size:12.5px; font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  }

  /* 会话设置 */
  .set-head { display:flex; align-items:center; gap:12px; padding:4px 2px 10px; border-bottom:1px solid var(--line); }
  .set-head .ava { width:48px; height:48px; font-size:18px; }
  .set-head b { display:block; font-size:16px; font-weight:650; }
  .set-head i { font-style:normal; font-size:12px; color:var(--muted); }
  .set-list { display:flex; flex-direction:column; }
  .set-row {
    display:flex; align-items:center; gap:10px; padding:13px 2px; width:100%; font-size:14.5px;
    border-bottom:1px solid var(--line); text-align:left;
  }
  .set-row:last-child { border-bottom:0; }
  .set-row > i { font-style:normal; font-size:16px; width:22px; text-align:center; }
  .set-row em { margin-left:auto; font-style:normal; font-size:12.5px; color:var(--muted); }
  .set-row.danger { color:var(--danger); }
  .switch { margin-left:auto; flex:none; width:44px; height:26px; border-radius:14px; background:#d7dbe7; position:relative; transition:background .18s; }
  .switch::after {
    content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .18s;
  }
  .switch.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .switch.on::after { transform:translateX(18px); }
  body.dark .switch { background:#3a4054; }

  /* 转账表单 */
  .balance-line { display:flex; align-items:center; font-size:13px; color:var(--muted); }
  .balance-line b { margin-left:auto; color:var(--text); font-size:15px; font-weight:650; }
  .amount-box { display:flex; align-items:center; gap:8px; padding:10px 2px 14px; border-bottom:1px solid var(--line); }
  .amount-box > span { font-size:26px; font-weight:700; }
  .amount-box input { flex:1; min-width:0; border:0; outline:none; background:transparent; font-size:30px; font-weight:700; }
  .quick-row { display:flex; gap:8px; }
  .quick-row button { flex:1; height:34px; border-radius:11px; border:1px solid var(--line); font-size:13px; font-weight:600; background:var(--bg); }
  .note-input { height:42px; border:1px solid var(--line); border-radius:13px; background:var(--bg); padding:0 13px; outline:none; font-size:14px; width:100%; }
  .btn-primary-lg {
    height:46px; border-radius:14px; font-size:15.5px; font-weight:650; color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .btn-primary-lg:disabled { opacity:.6; }

  /* 大图查看 */
  .viewer {
    position:fixed; inset:0; z-index:80; background:rgba(6,8,14,.95); display:none;
    align-items:center; justify-content:center; padding:18px;
  }
  .viewer.show { display:flex; }
  .viewer img { max-width:100%; max-height:100%; border-radius:8px; }
  .viewer .close { position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.16); color:#fff; font-size:18px; }

  /* ---------- 未登录 ---------- */
  .gate { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px; }
  .gate .big { font-size:44px; }
  .gate p { margin:0; color:var(--muted); font-size:13.5px; text-align:center; }
  .gate button {
    height:42px; padding:0 26px; border-radius:14px; font-weight:600; font-size:15px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  }

  .toast {
    position:fixed; left:50%; bottom:76px; transform:translate(-50%,10px); z-index:90;
    background:rgba(16,19,28,.92); color:#fff; padding:9px 16px; border-radius:12px; font-size:13.5px;
    opacity:0; pointer-events:none; transition:all .2s; max-width:88vw; text-align:center;
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <button class="back" id="backBtn" aria-label="返回">‹</button>
    <div class="who"><b>消息</b><i>和好友聊天</i></div>
    <button class="top-btn" id="addBtn">＋ 加好友</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="chat">好友</button>
    <button class="tab" data-tab="req">申请<em id="reqBadge" hidden>0</em></button>
  </div>

  <div class="share-bar" id="shareBar" hidden>
    <span id="shareBarText">选择好友，把商品发给他</span>
    <button id="shareCancel">取消</button>
  </div>

  <div class="list" id="list"></div>

  <div class="gate" id="gate" hidden>
    <div class="big">💬</div>
    <p>登录后就能加好友、和朋友一对一聊天</p>
    <button id="gateBtn">去登录</button>
  </div>

  <!-- 聊天面板 -->
  <section class="chat" id="chatPanel" aria-hidden="true">
    <div class="top">
      <button class="back" id="chatBack" aria-label="返回">‹</button>
      <div class="chat-who"><b id="chatName">聊天</b><i id="chatSub">好友</i></div>
      <button class="back" id="chatMore" aria-label="会话设置">⋯</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <button class="plus" id="plusBtn" aria-label="更多">＋</button>
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button class="send" id="sendBtn">发送</button>
    </div>
    <div class="panel" id="panel">
      <div class="panel-grid">
        <button class="tool" data-tool="image"><i>🖼️</i>图片</button>
        <button class="tool" data-tool="product"><i>🛍️</i>商品</button>
        <button class="tool" data-tool="transfer"><i>💰</i>转账</button>
        <button class="tool" data-tool="emoji"><i>😊</i>表情</button>
      </div>
      <div class="emoji-row" id="emojiRow"></div>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden />
  </section>

  <!-- 加好友 -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="addSheet">
    <h3>加好友<button id="sheetClose" data-close="addSheet">关闭</button></h3>
    <div class="search">
      <input id="q" placeholder="输入手机号或昵称" autocomplete="off" />
      <button id="searchBtn">搜索</button>
    </div>
    <div class="hint">输入对方的手机号或昵称（至少 1 个字）即可找到人；手机号需完整输入。</div>
    <div class="results" id="results"></div>
  </div>

  <!-- 会话设置 -->
  <div class="sheet" id="setSheet">
    <h3>会话设置<button data-close="setSheet">关闭</button></h3>
    <div class="set-head">
      <span class="ava" id="setAva">友</span>
      <span><b id="setName">好友</b><i id="setSub">好友</i></span>
    </div>
    <div class="set-list">
      <button class="set-row" id="pinRow"><i>📌</i>置顶聊天<span class="switch" id="pinSwitch"></span></button>
      <button class="set-row" id="muteRow"><i>🔕</i>消息免打扰<span class="switch" id="muteSwitch"></span></button>
      <button class="set-row" id="clearRow"><i>🧹</i>清空聊天记录<em>仅清空你这侧</em></button>
      <button class="set-row danger" id="removeRow"><i>🚫</i>删除好友</button>
    </div>
  </div>

  <!-- 选择商品 -->
  <div class="sheet" id="pkSheet">
    <h3>分享商品<button data-close="pkSheet">关闭</button></h3>
    <div class="search">
      <input id="pkQ" placeholder="搜索商品名称" autocomplete="off" />
    </div>
    <div class="pk-list" id="pkList"><div class="hint" style="padding:16px 2px">正在加载商品…</div></div>
  </div>

  <!-- 转账 -->
  <div class="sheet" id="transferSheet">
    <h3>转账<button data-close="transferSheet">关闭</button></h3>
    <div class="balance-line">可用余额<b id="tBal">¥0.00</b></div>
    <div class="amount-box">
      <span>¥</span>
      <input id="tAmount" inputmode="decimal" placeholder="0.00" autocomplete="off" />
    </div>
    <div class="quick-row">
      <button data-amt="1000">¥10</button>
      <button data-amt="2000">¥20</button>
      <button data-amt="5000">¥50</button>
      <button data-amt="10000">¥100</button>
    </div>
    <input class="note-input" id="tNote" maxlength="60" placeholder="转账说明（选填）" />
    <button class="btn-primary-lg" id="tSubmit">确认转账</button>
    <div class="hint">发起后先从你的余额扣款，对方点「收款」才真正到账；对方 24 小时不领会自动退回，中途你也可以撤销。</div>
  </div>

  <!-- 待收款 -->
  <div class="sheet" id="tfSheet">
    <h3>待收款<button data-close="tfSheet">关闭</button></h3>
    <div class="tf-list" id="tfBody"><div class="hint" style="padding:14px 2px">加载中…</div></div>
  </div>

  <!-- 大图 -->
  <div class="viewer" id="viewer"><button class="close" id="viewerClose">✕</button><img id="viewerImg" alt="" /></div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'user_token_v1';
  var DARK_KEY = 'dark_mode';
  var PREF_KEY = 'dm_pref_v1';

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list');
  var msgsEl = $('msgs');
  var inputEl = $('input');
  var toastEl = $('toast');

  var state = {
    me: '',
    friends: [],
    pending: 0,
    unread: 0,
    requests: { incoming: [], outgoing: [] },
    tab: 'chat',
    chatId: '',
    chatName: '',
    chatAvatar: null,
    msgs: [],
    sending: false,
    timerList: null,
    timerChat: null,
    searchSeq: 0,
    prefs: {},
    balance: 0,
    products: null,
    loadingOlder: false,
    tf: { incoming: [], outgoing: [], incomingCount: 0, incomingAmount: 0 },
    tfSig: '',
  };

  var params = new URLSearchParams(location.search);
  var sharecode = params.get('sharecode') || '';
  var shareQs = sharecode ? 'sharecode=' + encodeURIComponent(sharecode) : '';
  var pendingShare = params.get('share') || '';
  var wantTf = params.get('tf') === '1';

  /* ---------- 基础 ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function token() {
    var q = params.get('t');
    if (q) { try { localStorage.setItem(TOKEN_KEY, q); } catch (e) {} return q; }
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }

  function tokenPayload(t) {
    try {
      var p = String(t).split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
      while (p.length % 4) p += '=';
      var txt = decodeURIComponent(escape(atob(p)));
      return txt.split('|')[0] || null;
    } catch (e) { return null; }
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }

  function yuan(fen) {
    var n = (Number(fen) || 0) / 100;
    return '¥' + (n % 1 === 0 ? String(n) : n.toFixed(2));
  }
  function yuan2(fen) {
    return '¥' + ((Number(fen) || 0) / 100).toFixed(2);
  }

  function applyDark() {
    var on = false;
    try { on = localStorage.getItem(DARK_KEY) === '1'; } catch (e) {}
    document.body.classList.toggle('dark', on);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', on ? '#12141c' : '#f4f5f9');
  }

  function api(path, options) {
    options = options || {};
    var headers = { 'Content-Type': 'application/json' };
    var t = token();
    var url = path;
    if (t) {
      headers.Authorization = 'Bearer ' + t;
      headers['x-user-token'] = t;
      url += (path.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(t);
    }
    return fetch(url, Object.assign({ credentials: 'same-origin' }, options, {
      headers: Object.assign(headers, options.headers || {}),
    })).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) {
          var err = new Error(body.message || '请求失败（' + res.status + '）');
          err.status = res.status;
          throw err;
        }
        return body;
      });
    });
  }

  function homeUrl() {
    return '/' + (sharecode ? '?' + shareQs : '');
  }
  function productUrl(id) {
    return '/' + (sharecode ? '?' + shareQs + '&p=' : '?p=') + encodeURIComponent(id);
  }

  /* ---------- 会话偏好（置顶 / 免打扰） ---------- */
  function loadPrefs() {
    try {
      state.prefs = JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {};
    } catch (e) { state.prefs = {}; }
  }
  function prefOf(id) {
    return state.prefs[id] || { pin: 0, mute: 0 };
  }
  function setPref(id, key, on) {
    var p = prefOf(id);
    p[key] = on ? 1 : 0;
    state.prefs[id] = p;
    try { localStorage.setItem(PREF_KEY, JSON.stringify(state.prefs)); } catch (e) {}
  }

  /* ---------- 时间 ---------- */
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function hm(d) {
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function fmtStamp(ts) {
    if (!ts) return '';
    var d = new Date(ts), now = new Date(), t = hm(d);
    if (sameDay(d, now)) return t;
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (sameDay(d, y)) return '昨天 ' + t;
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + t;
  }
  function dayLabel(ts) {
    var d = new Date(ts), now = new Date();
    if (sameDay(d, now)) return '今天';
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (sameDay(d, y)) return '昨天';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /* ---------- 头像 ---------- */
  function avaHTML(avatar, nickname, cls) {
    var c = cls || 'ava';
    if (avatar) return '<span class="' + c + ' has-img"><img src="' + esc(avatar) + '" alt="" /></span>';
    var ini = String(nickname || '用').trim().slice(0, 1) || '用';
    return '<span class="' + c + '">' + esc(ini) + '</span>';
  }

  /* ---------- 列表渲染 ---------- */
  function sortedFriends() {
    return state.friends.slice().sort(function (a, b) {
      var pa = prefOf(a.id).pin ? 1 : 0;
      var pb = prefOf(b.id).pin ? 1 : 0;
      if (pa !== pb) return pb - pa;
      return (Number(b.lastAt) || 0) - (Number(a.lastAt) || 0);
    });
  }

  function renderList() {
    if (!token()) {
      $('gate').hidden = false;
      $('tabs').hidden = true;
      listEl.hidden = true;
      $('addBtn').hidden = true;
      return;
    }
    $('gate').hidden = true;
    $('tabs').hidden = false;
    listEl.hidden = false;
    $('addBtn').hidden = false;

    var badge = $('reqBadge');
    if (state.pending > 0) { badge.hidden = false; badge.textContent = state.pending > 99 ? '99+' : String(state.pending); }
    else badge.hidden = true;

    if (state.tab === 'req') return renderRequests();

    if (!state.friends.length) {
      listEl.innerHTML = tfStripHTML() + '<div class="empty"><div class="big">👋</div>' +
        '<p>还没有好友，加个朋友一起聊吧</p>' +
        '<button class="btn-mini primary" style="max-width:180px;margin:0 auto" id="emptyAdd">＋ 加好友</button></div>';
      bindTfStrip();
      var b = $('emptyAdd');
      if (b) b.onclick = openAdd;
      return;
    }

    listEl.innerHTML = tfStripHTML() + sortedFriends().map(function (f) {
      var pre = prefOf(f.id);
      var last = f.lastBody
        ? (f.lastFrom === state.me ? '我：' : '') + f.lastBody
        : '打个招呼吧';
      var badgeHTML = f.unread > 0
        ? (pre.mute
            ? '<span class="badge dot"></span>'
            : '<span class="badge">' + (f.unread > 99 ? '99+' : f.unread) + '</span>')
        : '<span class="badge zero"></span>';
      return '<button class="row" data-id="' + esc(f.id) + '">' +
        avaHTML(f.avatar, f.nickname) +
        '<span class="row-txt"><b>' + (pre.pin ? '<span class="pin-chip">置顶</span>' : '') +
        '<span>' + esc(f.nickname) + '</span></b><i>' + esc(last) + '</i></span>' +
        '<span class="row-meta"><em>' + esc(fmtStamp(f.lastAt)) + '</em>' + badgeHTML + '</span></button>';
    }).join('');

    Array.prototype.forEach.call(listEl.querySelectorAll('.row'), function (el) {
      el.onclick = function () { openChat(el.dataset.id); };
    });
    bindTfStrip();
  }

  function bindTfStrip() {
    var s = $('tfStrip');
    if (s) s.onclick = openTfSheet;
  }

  function renderRequests() {
    var inc = state.requests.incoming || [];
    var outg = state.requests.outgoing || [];
    if (!inc.length && !outg.length) {
      listEl.innerHTML = '<div class="empty"><div class="big">📭</div><p>暂时没有好友申请</p></div>';
      return;
    }
    var html = '';
    if (inc.length) {
      html += '<div class="section-note">收到的申请</div>';
      html += inc.map(function (r) {
        return '<div class="req-card"><div class="req-head">' + avaHTML(r.avatar, r.nickname) +
          '<b>' + esc(r.nickname) + '</b><em>' + esc(fmtStamp(r.createdAt)) + '</em></div>' +
          '<div class="req-acts">' +
          '<button class="btn-mini ghost" data-respond="0" data-id="' + esc(r.id) + '">忽略</button>' +
          '<button class="btn-mini primary" data-respond="1" data-id="' + esc(r.id) + '">同意</button>' +
          '</div></div>';
      }).join('');
    }
    if (outg.length) {
      html += '<div class="section-note">我发出的</div>';
      html += outg.map(function (r) {
        return '<div class="req-card"><div class="req-head">' + avaHTML(r.avatar, r.nickname) +
          '<b>' + esc(r.nickname) + '</b><em>等待对方同意</em></div></div>';
      }).join('');
    }
    listEl.innerHTML = html;
    Array.prototype.forEach.call(listEl.querySelectorAll('[data-respond]'), function (el) {
      el.onclick = function () { respond(el.dataset.id, el.dataset.respond === '1', el); };
    });
  }

  /* ---------- 数据加载 ---------- */
  function loadFriends(silent) {
    if (!token()) { renderList(); return Promise.resolve(); }
    return api('/api/friends').then(function (r) {
      state.friends = r.friends || [];
      state.pending = r.pending || 0;
      state.unread = r.unread || 0;
      renderList();
      if (state.tab === 'req') loadRequests(true);
    }).catch(function (e) {
      if (!silent) toast(e.message);
    });
  }

  function loadRequests(silent) {
    if (!token()) return Promise.resolve();
    return api('/api/friends/requests').then(function (r) {
      state.requests = { incoming: r.incoming || [], outgoing: r.outgoing || [] };
      if (state.tab === 'req') renderList();
    }).catch(function (e) {
      if (!silent) toast(e.message);
    });
  }

  function loadMe() {
    return api('/api/auth/me').then(function (r) {
      if (r.viewer) {
        state.balance = Number(r.viewer.balance) || 0;
        if (r.viewer.nickname) state.myName = r.viewer.nickname;
      }
    }).catch(function () {});
  }

  /* ---------- 聊天 ---------- */
  function openChat(id) {
    var f = state.friends.filter(function (x) { return x.id === id; })[0] || { id: id, nickname: '好友', avatar: null };
    state.chatId = id;
    state.chatName = f.nickname;
    state.chatAvatar = f.avatar;
    state.msgs = [];
    $('chatName').textContent = f.nickname;
    $('chatSub').textContent = '好友';
    msgsEl.innerHTML = '<div class="chat-empty">正在加载…</div>';
    $('chatPanel').classList.add('show');
    $('chatPanel').setAttribute('aria-hidden', 'false');
    hidePanel();
    loadThread(false).then(function () { scrollBottom(false); takePendingShare(); });
    startChatPoll();
    setTimeout(function () { inputEl.focus(); }, 240);
  }

  function closeChat() {
    $('chatPanel').classList.remove('show');
    $('chatPanel').setAttribute('aria-hidden', 'true');
    hidePanel();
    state.chatId = '';
    stopChatPoll();
    loadFriends(true);
  }

  function lastStamp() {
    if (!state.msgs.length) return '';
    var last = state.msgs[state.msgs.length - 1];
    if (!last || !last.createdAt) return '';
    // 服务端 created_at 精确到微秒，这里只到毫秒，+1ms 避免把自己重复拉回来
    return new Date(Number(last.createdAt) + 1).toISOString();
  }

  function loadThread(silent, incremental) {
    if (!state.chatId) return Promise.resolve();
    var id = state.chatId;
    var after = incremental && state.msgs.length ? lastStamp() : '';
    var q = '/api/dm/thread?userId=' + encodeURIComponent(id) + (after ? '&after=' + encodeURIComponent(after) : '');
    return api(q).then(function (r) {
      if (state.chatId !== id) return;
      if (r.friend && r.friend.nickname) {
        state.chatName = r.friend.nickname;
        state.chatAvatar = r.friend.avatar || state.chatAvatar;
        $('chatName').textContent = r.friend.nickname;
      }
      var incoming = r.messages || [];
      if (!after) {
        state.msgs = incoming;
      } else if (incoming.length) {
        var seen = {};
        state.msgs.forEach(function (m) { seen[m.id] = 1; });
        incoming.forEach(function (m) { if (!seen[m.id]) state.msgs.push(m); });
      }
      // 转账卡片状态补丁：对方收款 / 退还 / 撤销后，老消息不会重发，用补丁同步
      var patches = r.transfers || [];
      if (patches.length) {
        var byId = {};
        patches.forEach(function (x) { if (x && x.id) byId[x.id] = x.payload; });
        state.msgs.forEach(function (m) {
          if (m.kind === 'transfer' && byId[m.id]) m.payload = byId[m.id];
        });
      }
      paint();
    }).catch(function (e) {
      if (silent) return;
      msgsEl.innerHTML = '<div class="chat-empty">' + esc(e.message) + '</div>';
    });
  }

  function nearBottom() {
    return msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 90;
  }
  function scrollBottom(smooth) {
    msgsEl.scrollTo({ top: msgsEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  function msgHTML(m) {
    var kind = m.kind || 'text';
    var p = m.payload || {};
    if (kind === 'image') {
      var src = String(p.dataUrl || '');
      return '<div class="bubble media"><img src="' + esc(src) + '" alt="图片" data-view="' + esc(src) + '" loading="lazy" /></div>';
    }
    if (kind === 'product') {
      var title = String(p.title || m.body || '商品');
      var img = String(p.image || '');
      var thumb = img
        ? '<span class="pcard-thumb" style="background-image:url(\'' + esc(img) + '\')"></span>'
        : '<span class="pcard-thumb ph">🛍️</span>';
      return '<button class="pcard" data-product="' + esc(p.productId || '') + '">' + thumb +
        '<span class="pcard-body"><b>' + esc(title) + '</b>' +
        '<span class="pcard-price"><em>' + esc(yuan(p.amount)) + '</em><span>去看看 ›</span></span>' +
        '</span></button>';
    }
    if (kind === 'transfer') {
      var amt = Number(p.amount) || 0;
      var note = String(p.note || '');
      var st = String(p.status || 'pending');
      var tid = String(p.tid || '');
      var mine = m.fromUser === state.me;
      var label = ({
        pending: mine ? '等待对方收款' : '待你收款',
        accepted: mine ? '对方已收款' : '✓ 已收款，金额到账',
        rejected: mine ? '对方已退还，金额退回' : '你已退还，金额退回对方',
        canceled: mine ? '✓ 已撤销，金额退回余额' : '对方已撤销，金额退回',
        expired: '超过 24 小时未领取，已退回',
        done: '✓ 已到账',
      })[st] || '处理中';
      var acts = '';
      if (st === 'pending' && tid) {
        acts = mine
          ? '<div class="tcard-acts"><button class="tcard-btn ghost" data-tf="' + esc(tid) + '" data-tfact="cancel">撤销转账</button></div>'
          : '<div class="tcard-acts">' +
            '<button class="tcard-btn ghost" data-tf="' + esc(tid) + '" data-tfact="reject">退还</button>' +
            '<button class="tcard-btn" data-tf="' + esc(tid) + '" data-tfact="accept">收款</button></div>';
      }

  /* 图片：等比压缩后上传（避免原图太大） */
  function pickImage() {

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\//.test(file.type)) return reject(new Error('请选择图片文件'));
      if (file.size > 12 * 1024 * 1024) return reject(new Error('图片太大（超过 12MB）'));
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var max = 1000;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var quality = 0.72;
        var out = '', w = img.width, h = img.height;
        for (var i = 0; i < 5; i++) {
          w = Math.max(1, Math.round(img.width * scale));
          h = Math.max(1, Math.round(img.height * scale));
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          out = cv.toDataURL('image/jpeg', quality);
          if (out.length <= 460000) break;
          scale *= 0.82;
          quality = Math.max(0.5, quality - 0.07);
        }
        if (out.length > 780000) return reject(new Error('这张图压缩后还是太大，换一张试试'));
        resolve({ dataUrl: out, w: w, h: h });
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('图片读取失败'));
      };
      img.src = url;
    });
  }

    hidePanel();

      return sendPayload('image', out, '');
    }).catch(function (e) {
      toast(e.message || '图片发送失败');
    });
  });

  function transferAmountFen() {
    var raw = String($('tAmount').value || '').replace(/[^\d.]/g, '');
    var n = Number(raw);
    if (!Number.isFinite(n) || n <= 0) return 0;
    return Math.round(n * 100);
  }

  function doTransfer() {
    if (!state.chatId) return;
    var fen = transferAmountFen();
    if (fen < 1) return toast('请输入转账金额');
    if (fen > 500000) return toast('单笔转账最多 ¥5000');
    if (fen > state.balance) return toast('余额不足，先充值再来转账');
    var btn = $('tSubmit');
    btn.disabled = true;
    btn.textContent = '转账中…';
    api('/api/dm/transfer', {
      method: 'POST',
      body: JSON.stringify({ toUserId: state.chatId, amountFen: fen, note: String($('tNote').value || '').trim() }),
    }).then(function (r) {
      state.balance = Number(r.balance) || Math.max(0, state.balance - fen);
      closeSheet('transferSheet');
      toast('已发起，等对方收款 ' + yuan2(fen));
      return loadThread(true, true);
    }).catch(function (e) {
      toast(e.message || '转账失败');
    }).then(function () {
      btn.disabled = false;
      btn.textContent = '确认转账';
      loadTransferPending();

  /* ---------- 收款 / 退还 / 撤销 ---------- */
  function tfWord(action, status) {
    if (action === 'accept') return '已收款';
    if (action === 'reject') return '已退还';
    if (action === 'cancel') return '已撤销';
    return status === 'expired' ? '已过期退回' : '已处理';
  }

  function actTransfer(tid, action, btn) {
    if (!tid || !action) return;
    if (action === 'accept' && !window.confirm('确认收款？钱会进入你的余额。')) return;
    if (action === 'reject' && !window.confirm('确定退还这笔转账？金额会退回给对方。')) return;
    if (action === 'cancel' && !window.confirm('确定撤销这笔转账？金额会退回你的余额。')) return;
    var all = document.querySelectorAll('[data-tf="' + tid + '"]');
    Array.prototype.forEach.call(all, function (b) { b.disabled = true; });
    api('/api/dm/transfer/act', {
      method: 'POST',
      body: JSON.stringify({ transferId: tid, action: action }),
    }).then(function (r) {
      var st = r.status || (action === 'accept' ? 'accepted' : action === 'reject' ? 'rejected' : 'canceled');
      state.msgs.forEach(function (m) {
        if (m.kind === 'transfer' && m.payload && m.payload.tid === tid) {
          m.payload = Object.assign({}, m.payload, { status: st });
        }
      });
      if (typeof r.balance === 'number') state.balance = r.balance;
      paint();
      toast(tfWord(action, st));
      loadTransferPending();
      if (state.tab !== 'req') loadFriends(true);
    }).catch(function (e) {
      toast(e.message || '操作失败');
      Array.prototype.forEach.call(all, function (b) { b.disabled = false; });
      loadThread(true, true);
    });
  }

        outgoing: r.outgoing || [],

      // 只在待收款有变化时重绘列表，避免定时轮询把列表滚动位置顶回去

        if (rel === 'pending_out') { toast('已经申请过了，等对方同意'); return; }
        if (rel === 'pending_in') { closeAdd(); switchTab('req'); loadRequests(); return; }
        addFriend(el.dataset.uid, el);
      };
    });
  }

  function doSearch() {
    var q = String($('q').value || '').trim();
    if (!q) { $('results').innerHTML = ''; return; }
    var seq = ++state.searchSeq;
    $('results').innerHTML = '<div class="hint" style="padding:14px 2px">搜索中…</div>';
    api('/api/friends/search?q=' + encodeURIComponent(q)).then(function (r) {
      if (seq !== state.searchSeq) return;
      renderResults(r.list || []);
    }).catch(function (e) {
      if (seq !== state.searchSeq) return;
      $('results').innerHTML = '<div class="hint" style="padding:14px 2px">' + esc(e.message) + '</div>';
    });
  }

  function addFriend(uid, el) {
    if (el) { el.disabled = true; el.textContent = '发送中…'; }
    api('/api/friends/request', { method: 'POST', body: JSON.stringify({ toUserId: uid }) })
      .then(function (r) {
        if (r.status === 'accepted') { toast('你们已成为好友'); loadFriends(true); loadRequests(true); }
        else if (r.status === 'friend') { toast('你们已经是好友了'); }
        else { toast('好友申请已发出'); }
        if (el) { el.textContent = '已申请'; el.className = 'res-btn done'; }
        loadRequests(true);
      })
      .catch(function (e) {
        toast(e.message);
        if (el) { el.disabled = false; el.textContent = '加好友'; }
      });
  }

  function respond(id, accept, el) {
    if (el) { el.disabled = true; el.textContent = accept ? '处理中…' : '忽略中…'; }
    api('/api/friends/respond', { method: 'POST', body: JSON.stringify({ id: id, accept: accept }) })
      .then(function () {
        toast(accept ? '已添加为好友' : '已忽略');
        loadRequests(true);
        loadFriends(true);
      })
      .catch(function (e) {
        toast(e.message);
        if (el) { el.disabled = false; el.textContent = accept ? '同意' : '忽略'; }
      });
  }

  /* ---------- 分段 ---------- */
  function switchTab(tab) {
    state.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('on', t.dataset.tab === tab);
    });
    renderList();
    if (tab === 'req') loadRequests();
  }

  /* ---------- 绑定 ---------- */
  $('backBtn').onclick = function () { location.href = homeUrl(); };
  $('gateBtn').onclick = function () { location.href = homeUrl(); };
  $('addBtn').onclick = openAdd;
  $('searchBtn').onclick = doSearch;
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  });
  $('chatBack').onclick = closeChat;
  $('chatMore').onclick = openSettings;
  $('sendBtn').onclick = sendText;
  $('plusBtn').onclick = togglePanel;
  $('pinRow').onclick = togglePin;
  $('muteRow').onclick = toggleMute;
  $('clearRow').onclick = clearHistory;
  $('removeRow').onclick = removeFriend;
  $('pkQ').addEventListener('input', renderProductPicker);
  $('tSubmit').onclick = doTransfer;
  Array.prototype.forEach.call(document.querySelectorAll('.quick-row button'), function (el) {
    el.onclick = function () { $('tAmount').value = (Number(el.dataset.amt) / 100).toFixed(2); };
  });

  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(110, inputEl.scrollHeight) + 'px';
  });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });
  inputEl.addEventListener('focus', hidePanel);

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.onclick = function () { switchTab(t.dataset.tab); };
  });

  // 从聊天面板侧滑返回（移动端手势）
  (function () {
    var sx = 0;
    $('chatPanel').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    $('chatPanel').addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - sx;
      if (sx < 40 && dx > 70) closeChat();
    }, { passive: true });
  })();

  /* ---------- 启动 ---------- */
  applyDark();
  loadPrefs();
  var t = token();
  state.me = t ? tokenPayload(t) || '' : '';
  renderList();
  if (t) {
    loadMe();
    loadFriends();
    loadRequests(true);
    loadTransferPending().then(function () {
      if (wantTf) setTimeout(openTfSheet, 150);
    });
    showShareBar();
    state.timerList = setInterval(function () {
      if (document.hidden) return;
      loadFriends(true);
      loadTransferPending();
      if (state.tab === 'req') loadRequests(true);
    }, 6000);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (state.chatId) loadThread(true, true);
    else loadFriends(true);
  });

  // 直接带好友 id 进来（从别处跳转）时自动打开对话
  var openId = params.get('u') || params.get('userId');
  if (openId && t) {
    setTimeout(function () {
      loadFriends(true).then(function () { openChat(openId); });
    }, 120);
  }
})();
</script>
</body>
</html>
