<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>南京麻将 · 144 张带花</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:," />
<style>
  :root {
    --ink:#22301f; --sub:#7b8a77; --felt1:#1f6b45; --felt2:#17583a;
    --gold:#e8c06a; --danger:#d64545; --line:rgba(255,255,255,.16);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    background:#0f2419; color:#f4f8f2; overflow:hidden;
    display:flex; flex-direction:column; user-select:none; -webkit-user-select:none;
  }

  /* ---------- 顶栏 ---------- */
  .top {
    flex:none; display:flex; align-items:center; gap:8px;
    padding:calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
    background:linear-gradient(180deg,#123020,#0f2419);
  }
  .tbtn {
    border:1px solid var(--line); background:rgba(255,255,255,.08); color:#eaf3e6;
    border-radius:10px; padding:7px 11px; font-size:13px; font-family:inherit; cursor:pointer;
  }
  .tbtn:active { transform:scale(.96); }
  .top-title { flex:1; text-align:center; font-size:14.5px; font-weight:700; letter-spacing:.5px; }
  .top-title i { display:block; font-style:normal; font-size:10.5px; font-weight:400; color:#9fb8a4; letter-spacing:0; }

  /* ---------- 牌桌 ---------- */
  .table {
    flex:1; min-height:0; display:flex; flex-direction:column;
    padding:4px 8px 0;
    background:radial-gradient(120% 80% at 50% 30%, var(--felt1) 0%, var(--felt2) 60%, #123c29 100%);
  }
  .seat-top { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .seat-mid { flex:1; min-height:0; display:flex; align-items:stretch; gap:4px; }
  .seat-side { flex:none; width:44px; display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:6px; }
  .seat-center { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .seat-me { flex:none; display:flex; flex-direction:column; align-items:center; gap:5px; padding-bottom:6px; }

  .pinfo {
    display:flex; align-items:center; gap:5px; font-size:11px;
    background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:999px;
    padding:3px 9px; white-space:nowrap;
  }
  .pinfo b { font-weight:600; font-size:11.5px; }
  .pinfo em { font-style:normal; color:var(--gold); }
  .pinfo.turn { border-color:var(--gold); box-shadow:0 0 0 2px rgba(232,192,106,.25); }
  .pinfo.turn b::after { content:' ·出牌'; color:var(--gold); font-weight:400; }

  /* 牌背 */
  .backs { display:flex; gap:1px; }
  .backs.v { flex-direction:column; gap:1px; }
  .back {
    width:15px; height:20px; border-radius:3px;
    background:linear-gradient(160deg,#2f7d59,#1c5a3c);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
  }
  .backs.v .back { width:20px; height:12px; }

  /* 副露 */
  .melds { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; justify-content:center; }
  .backs.v + .melds { margin-top:2px; }
  .meld { display:flex; gap:1px; }

  /* 牌面 */
  .tile {
    position:relative; width:34px; height:46px; border-radius:5px; flex:none;
    background:linear-gradient(180deg,#fffdf6 0%,#f5efe0 72%,#e6ddc7 100%);
    border:1px solid #d6cbb0; box-shadow:0 2px 0 #cfc3a6, 0 3px 6px rgba(0,0,0,.22);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0; padding:0; font-family:inherit; cursor:default; color:#22301f;
    transition:transform .12s ease, box-shadow .12s ease, margin .12s ease;
  }
  .tile b { font-size:16px; line-height:1; font-weight:700; letter-spacing:-.5px; }
  .tile i { font-style:normal; font-size:9.5px; line-height:1.2; opacity:.92; }
  .tile.s-m b, .tile.s-m i { color:#c0362c; }
  .tile.s-s b, .tile.s-s i { color:#2f7d4f; }
  .tile.s-p b, .tile.s-p i { color:#2b5fa8; }
  .tile.s-z b, .tile.s-z i { color:#3a3a46; }
  .tile.s-z.z-zhong b { color:#c0362c; }
  .tile.s-z.z-fa b { color:#2f7d4f; }
  .tile.s-z.z-bai b { color:#5a6b8c; }
  .tile.s-h {
    background:linear-gradient(180deg,#fffaea 0%,#f8eed4 72%,#ecdfbe 100%);
    border-color:#e2cfa0;
  }
  .tile.s-h b { color:#a1651b; }
  .meld.hua-meld {
    border:1px dashed rgba(232,192,106,.55); border-radius:5px; padding:1px; gap:1px;
  }
  .pinfo .hua { color:#9ed8a9; }

  .tile.sm { width:22px; height:30px; border-radius:4px; box-shadow:0 1px 0 #cfc3a6; }
  .tile.sm b { font-size:11px; }
  .tile.sm i { font-size:7px; }
  .tile.xs { width:18px; height:25px; border-radius:3px; box-shadow:0 1px 0 #cfc3a6; }
  .tile.xs b { font-size:9px; }
  .tile.xs i { font-size:6px; }

  .hand {
    --hw: min(34px, calc((100vw - 22px) / 14 - 2px));
    display:flex; gap:1px; justify-content:center; align-items:flex-end; flex-wrap:nowrap;
    width:100%; padding:0 2px;
  }
  .hand .tile { width:var(--hw); height:calc(var(--hw) * 1.36); }
  .hand .tile b { font-size:calc(var(--hw) * 0.46); }
  .hand .tile i { font-size:calc(var(--hw) * 0.27); }
  .hand .tile.can { cursor:pointer; }
  .hand .tile.can:active { transform:translateY(-6px); }
  .hand .tile.picked { margin-left:8px; }
  .hand .tile.isnew { animation:pop .22s ease; }
  @keyframes pop { from { transform:translateY(-10px) scale(.9); opacity:.4; } to { transform:none; opacity:1; } }

  /* 牌河 */
  .river {
    display:grid; grid-template-columns:repeat(6, auto); gap:2px; justify-content:center;
    max-width:100%;
  }
  .river.v { grid-template-columns:repeat(2, auto); }
  .dt {
    width:20px; height:28px; border-radius:3px; position:relative;
    background:linear-gradient(180deg,#fffdf6,#eee7d4);
    border:1px solid #cdc0a2; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#22301f; box-shadow:0 1px 0 rgba(0,0,0,.18);
  }
  .dt b { font-size:10px; line-height:1; }
  .dt i { font-style:normal; font-size:6px; line-height:1.2; }
  .dt.s-m b, .dt.s-m i { color:#c0362c; }
  .dt.s-s b, .dt.s-s i { color:#2f7d4f; }
  .dt.s-p b, .dt.s-p i { color:#2b5fa8; }
  .dt.s-z b, .dt.s-z i { color:#3a3a46; }
  .dt.last { border-color:var(--gold); box-shadow:0 0 0 2px rgba(232,192,106,.55); }

  .center-box {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:14px;
    padding:8px 12px; min-width:118px;
  }
  .center-box .wall { font-size:11px; color:#bfd3c2; }
  .center-box .wall b { color:#fff; font-size:15px; }
  .center-box .lastbig { min-height:32px; display:flex; align-items:center; gap:4px; }
  .center-box .hint { font-size:10.5px; color:#c9dcc9; text-align:center; line-height:1.4; }

  /* 操作栏 */
  .actions {
    flex:none; display:flex; gap:8px; justify-content:center; align-items:center;
    padding:6px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
    background:#0f2419; min-height:52px; flex-wrap:wrap;
  }
  .act {
    border:0; border-radius:12px; padding:10px 18px; font-size:15px; font-weight:700;
    font-family:inherit; color:#22301f; cursor:pointer;
    background:linear-gradient(180deg,#ffe9a8,#e8c06a);
    box-shadow:0 3px 0 #a9853c, 0 4px 10px rgba(0,0,0,.3);
  }
  .act:active { transform:translateY(2px); box-shadow:0 1px 0 #a9853c; }
  .act.ghost { background:rgba(255,255,255,.12); color:#dfeadb; box-shadow:none; border:1px solid var(--line); }
  .act.hu { background:linear-gradient(180deg,#ff9f8f,#e0473a); color:#fff; box-shadow:0 3px 0 #9c2a20; }
  .act .sub { display:block; font-size:10px; font-weight:400; opacity:.8; }
  .tipbar { font-size:11.5px; color:#a9c2ac; text-align:center; }

  /* 遮罩 */
  .overlay {
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; padding:18px;
    background:rgba(6,18,12,.78); backdrop-filter:blur(4px);
  }
  .overlay.show { display:flex; }
  .panel {
    width:100%; max-width:360px; max-height:86vh; overflow:auto;
    background:linear-gradient(180deg,#1d3a29,#17301f); border:1px solid rgba(232,192,106,.35);
    border-radius:20px; padding:20px 18px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .panel h2 { margin:0 0 4px; font-size:20px; text-align:center; }
  .panel .sub { margin:0 0 12px; text-align:center; font-size:12px; color:#a9c2ac; }
  .fanlist { display:flex; flex-direction:column; gap:6px; margin:10px 0 4px; }
  .fanrow { display:flex; justify-content:space-between; font-size:13px; padding:6px 10px; background:rgba(255,255,255,.06); border-radius:9px; }
  .fanrow b { color:var(--gold); }
  .fanrow.total { background:rgba(232,192,106,.16); font-weight:700; }
  .handrow { display:flex; gap:2px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
  .panel .btns { display:flex; gap:10px; margin-top:14px; }
  .panel .btns button { flex:1; }
  .rules { font-size:12.5px; line-height:1.75; color:#cfe0cf; }
  .rules h3 { font-size:13.5px; color:var(--gold); margin:14px 0 4px; }
  .rules ul { margin:0; padding-left:18px; }
  .scoreboard { width:100%; font-size:13px; margin-top:8px; }
  .scoreboard tr td { padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.08); }
  .scoreboard tr td:last-child { text-align:right; font-weight:700; }
  .pos { color:#7fd6a0; } .neg { color:#f08a7f; }
</style>
</head>
<body>
  <div class="top">
    <button class="tbtn" id="backBtn">‹ 返回</button>
    <div class="top-title">南京麻将<i id="roundTxt">东风 · 第 1 局</i></div>
    <button class="tbtn" id="ruleBtn">规则</button>
  </div>

  <div class="table">
    <div class="seat-top" id="seatTop"></div>
    <div class="seat-mid">
      <div class="seat-side" id="seatLeft"></div>
      <div class="seat-center" id="centerBox"></div>
      <div class="seat-side" id="seatRight"></div>
    </div>
    <div class="seat-me" id="seatMe"></div>
  </div>

  <div class="actions" id="actions"></div>

  <div class="overlay" id="ov">
    <div class="panel" id="ovPanel"></div>
  </div>

<script>
/* =====================================================================
   南京麻将（本地桌简化版）
   - 144 张：万/条/筒 108 + 东南西北 16 + 硬花 20（春夏秋冬·梅兰竹菊 8 张 + 中发白各 4 张）
   - 不吃（南京麻将只碰不吃）、碰、明杠、暗杠、补杠、点炮胡、自摸
   - 摸到硬花即亮出，从牌尾补一张（补花），每张硬花 +2 花
   - 胡牌权：小胡须门清或 4 张以上硬花，大胡不限
   - 花数：底 20 花 + 门清/对对胡/混一色/清一色/七对/豪华七对/杠开/自摸/缺一门/海底 + 花牌
   ===================================================================== */
(function () {
  'use strict';

  /* ---------------- 牌 ---------------- */
  var SUIT_ORDER = ['m', 's', 'p', 'z'];
  var SUIT_CN = { m: '万', s: '条', p: '筒', z: '' };
  var ZI = ['东', '南', '西', '北', '中', '发', '白'];
  // 南京麻将 144 张 = 124 张主牌 + 20 张硬花
  // 硬花：春夏秋冬、梅兰竹菊各 1 张（8 张）+ 红中/发财/白板各 4 张（12 张）
  var HUA_TXT = ['春', '夏', '秋', '冬', '梅', '兰', '竹', '菊'];
  var HUA_KINDS = HUA_TXT.map(function (_, i) { return 'h' + (i + 1); });
  var JIAN = ['f1', 'f2', 'f3'];                                   // 红中 / 发财 / 白板
  var JIAN_TXT = { f1: '中', f2: '发', f3: '白' };
  var JIAN_CLS = { f1: 'z-zhong', f2: 'z-fa', f3: 'z-bai' };
  var HUA_TOTAL = HUA_KINDS.length + JIAN.length * 4;               // 20 张硬花

  /** 手牌牌种：万条筒 27 + 东南西北 4（中发白是硬花，不当字牌用） */
  function allKinds() {
    var out = [];
    for (var s = 0; s < 3; s++) for (var n = 1; n <= 9; n++) out.push(SUIT_ORDER[s] + n);
    for (var z = 0; z < 4; z++) out.push('z' + (z + 1));
    return out;
  }
  var KINDS = allKinds();

  function idx(k) {
    if (k[0] === 'h') return -1; // 花牌不进手牌、不参与牌型
    if (k[0] === 'z') return 27 + Number(k.slice(1)) - 1;
    return SUIT_ORDER.indexOf(k[0]) * 9 + Number(k.slice(1)) - 1;
  }
  function kindOf(i) {
    return i < 27 ? SUIT_ORDER[Math.floor(i / 9)] + ((i % 9) + 1) : 'z' + (i - 27 + 1);
  }
  function suitOf(k) { return k[0]; }
  function isHonor(k) { return k[0] === 'z'; }
  function isHua(k) { return k[0] === 'h' || k[0] === 'f'; }
  function faceOf(k) {
    if (k[0] === 'f') return { suit: 'f', num: '', txt: JIAN_TXT[k] || '花', cls: 's-h s-z ' + (JIAN_CLS[k] || '') };
    if (k[0] === 'h') return { suit: 'h', num: '', txt: HUA_TXT[Number(k.slice(1)) - 1], cls: 's-h' };
    if (k[0] === 'z') return { suit: 'z', num: '', txt: ZI[Number(k.slice(1)) - 1], cls: 's-z z-' + ['dong','nan','xi','bei','zhong','fa','bai'][Number(k.slice(1)) - 1] };
    var s = k[0];
    var cls = s === 'm' ? 's-m' : s === 's' ? 's-s' : 's-p';
    return { suit: s, num: k.slice(1), txt: SUIT_CN[s], cls: cls };
  }
  function tileHTML(k, size) {
    var f = faceOf(k);
    var sz = size ? ' ' + size : '';
    if (k[0] === 'z' || isHua(k)) return '<span class="tile' + sz + ' ' + f.cls + '"><b>' + f.txt + '</b></span>';
    return '<span class="tile' + sz + ' ' + f.cls + '"><b>' + f.num + '</b><i>' + f.txt + '</i></span>';
  }
  function discardHTML(k, last) {
    var f = faceOf(k);
    if (k[0] === 'z' || isHua(k)) return '<span class="dt ' + f.cls + (last ? ' last' : '') + '"><b>' + f.txt + '</b></span>';
    return '<span class="dt ' + f.cls + (last ? ' last' : '') + '"><b>' + f.num + '</b><i>' + f.txt + '</i></span>';
  }

  /* ---------------- 胡牌判定 ---------------- */
  function countsOf(kinds) {
    var c = new Array(34).fill(0);
    for (var i = 0; i < kinds.length; i++) {
      if (isHua(kinds[i])) continue; // 花牌不参与牌型
      c[idx(kinds[i])]++;
    }
    return c;
  }
  function meldsOK(c) {
    var i = 0;
    while (i < 34 && c[i] === 0) i++;
    if (i === 34) return true;
    if (c[i] >= 3) {
      c[i] -= 3;
      var ok = meldsOK(c);
      c[i] += 3;
      if (ok) return true;
    }
    if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--;
      var ok2 = meldsOK(c);
      c[i]++; c[i + 1]++; c[i + 2]++;
      if (ok2) return true;
    }
    return false;
  }
  /** kinds：手牌（含刚摸到的那张），meldCount：已副露组数 */
  function canWin(kinds, meldCount) {
    meldCount = meldCount || 0;
    if (kinds.length !== 14 - meldCount * 3) return false;
    var c = countsOf(kinds);
    if (meldCount === 0) {
      var pairs = 0, ok = true;
      for (var i = 0; i < 34; i++) {
        if (c[i] % 2 !== 0) { ok = false; break; }
        pairs += c[i] / 2;
      }
      if (ok && pairs === 7) return true;
    }
    for (var j = 0; j < 34; j++) {
      if (c[j] >= 2) {
        c[j] -= 2;
        var win = meldsOK(c);
        c[j] += 2;
        if (win) return true;
      }
    }
    return false;
  }
  /** 是否对对胡（手牌能拆成全刻子 + 一对） */
  function isAllTriplets(kinds) {
    var c = countsOf(kinds);
    var pair = 0;
    for (var i = 0; i < 34; i++) {
      if (c[i] === 0) continue;
      if (c[i] === 2) { pair++; continue; }
      if (c[i] !== 3) return false;
    }
    return pair === 1;
  }
  /** 七对（含豪华判断） */
  function sevenPairs(kinds) {
    if (kinds.length !== 14) return null;
    var c = countsOf(kinds);
    var pairs = 0, quads = 0;
    for (var i = 0; i < 34; i++) {
      if (c[i] === 0) continue;
      if (c[i] % 2 !== 0) return null;
      pairs += c[i] / 2;
      if (c[i] === 4) quads++;
    }
    if (pairs !== 7) return null;
    return { quads: quads };
  }

  /** 大胡：七对 / 清一色 / 混一色 / 对对胡 / 全球独钓 —— 不受胡牌权限制 */
  function isBigHu(hand, melds) {
    melds = melds || [];
    if (sevenPairs(hand)) return true;
    var all = hand.slice();
    melds.forEach(function (m) { all = all.concat(m.tiles); });
    var suits = {};
    all.forEach(function (k) { suits[k[0]] = 1; });
    var numSuits = ['m', 's', 'p'].filter(function (s2) { return suits[s2]; });
    if (numSuits.length === 1) return true;                    // 清一色 / 混一色
    if (isAllTriplets(hand)) return true;                      // 对对胡（副露也必是刻）
    if (melds.length === 4 && hand.length === 2) return true;  // 全球独钓
    return false;
  }

  /** 胡牌权：小胡必须门清、或亮出 4 张以上硬花；大胡不限（南京麻将口口相传的规矩） */
  function hasWinRight(p, hand, melds) {
    var ms = melds || (p && p.melds) || [];
    var menqing = ms.every(function (m) { return m.type === 'angang'; });
    if (menqing) return true;
    if (p && p.flowers && p.flowers.length >= 4) return true;
    return isBigHu(hand, ms);
  }

  /** 番型与花数（简化版南京算花：底 20 花起） */
  function scoreOf(info) {
    var hand = info.hand, melds = info.melds || [];
    var all = hand.slice();
    melds.forEach(function (m) { all = all.concat(m.tiles); });

    var suits = {};
    all.forEach(function (k) { suits[suitOf(k)] = (suits[suitOf(k)] || 0) + 1; });
    var numSuits = ['m', 's', 'p'].filter(function (s) { return suits[s]; });
    var hasHonor = Boolean(suits.z);

    var flowers = 20;
    var list = [{ name: '底花（跑 20）', n: 20 }];
    var add = function (name, n) { flowers += n; list.push({ name: name, n: n }); };

    var sp = sevenPairs(hand);
    var menqing = melds.every(function (m) { return m.type === 'angang'; });

    if (sp) {
      add('七对', 80);
      if (sp.quads === 1) add('豪华七对', 80);
      else if (sp.quads === 2) add('超豪华七对', 160);
      else if (sp.quads >= 3) add('超超豪华七对', 240);
    } else {
      if (menqing) add('门清', 20);
      if (isAllTriplets(hand)) add('对对胡', 40);
    }

    if (!sp) {
      if (numSuits.length === 1 && !hasHonor) add('清一色', 60);
      else if (numSuits.length === 1 && hasHonor) add('混一色', 40);
    }

    // 缺一门：万条筒里只用到两门（清一色/混一色另算，不重复计）
    if (numSuits.length === 2) add('缺一门', 10);
    // 亮出的花牌：每张 +2 花
    var flowerN = Number(info.flowerCount) || 0;
    if (flowerN > 0) add('花牌 ×' + flowerN, flowerN * 2);
    if (info.selfDraw) add('自摸', 10);
    if (info.gangDraw) add('杠上开花', 40);
    if (info.wallLeft <= 8) add('海底捞月', 10);

    return { flowers: flowers, list: list };
  }

  /* ---------------- 游戏状态 ---------------- */
  var NAMES = ['我', '下家', '对家', '上家'];
  var state = null;
  var uidSeq = 0;

  function newTile(k) { return { u: ++uidSeq, k: k }; }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /** 发牌：摸到花牌直接亮出并继续补，直到凑够 n 张主牌 */
  function dealTo(p, n) {
    var got = 0;
    while (got < n && state.wall.length) {
      var t = state.wall.pop();
      if (isHua(t.k)) { p.flowers.push(t.k); continue; }
      p.hand.push(t);
      got++;
    }
  }

  function newGame(seed) {
    var wall = [];
    KINDS.forEach(function (k) { for (var i = 0; i < 4; i++) wall.push(newTile(k)); });
    // 20 张硬花：春夏秋冬 · 梅兰竹菊 各 1 张 + 红中 / 发财 / 白板 各 4 张 → 合计 144 张
    HUA_KINDS.forEach(function (k) { wall.push(newTile(k)); });
    JIAN.forEach(function (k) { for (var j = 0; j < 4; j++) wall.push(newTile(k)); });
    shuffle(wall);
    state = {
      wall: wall,
      players: NAMES.map(function (n, i) {
        return { i: i, name: n, hand: [], melds: [], flowers: [], river: [], score: 0 };
      }),
      turn: 0,
      dealer: 0,
      phase: 'deal',
      last: null,
      wallLeft: 0,
      round: 1,
      over: false,
      gangDraw: false,
      justDrew: null,
      claim: null,
      timer: null,
      seed: seed || Date.now(),
      log: [],
    };
    for (var p = 0; p < 4; p++) dealTo(state.players[p], 13);
    sortHand(state.players[0]);
    state.phase = 'play';
    return state;
  }

  function sortHand(p) {
    p.hand.sort(function (a, b) { return idx(a.k) - idx(b.k); });
  }
  function handKinds(p) { return p.hand.map(function (t) { return t.k; }); }
  function wallLeft() { return state ? state.wall.length : 0; }

  /* ---------------- 渲染 ---------------- */
  var $ = function (id) { return document.getElementById(id); };

  function pinfoHTML(p, showTurn) {
    var on = showTurn && state.turn === p.i && !state.over;
    var hua = p.flowers && p.flowers.length ? '<em class="hua">花 ' + p.flowers.length + '</em>' : '';
    return '<div class="pinfo' + (on ? ' turn' : '') + '"><b>' + p.name + '</b>' +
      '<em>' + (p.score >= 0 ? '+' : '') + p.score + '</em>' + hua + '</div>';
  }
  function backsHTML(n, vertical) {
    var out = '';
    for (var i = 0; i < n; i++) out += '<span class="back"></span>';
    return '<div class="backs' + (vertical ? ' v' : '') + '">' + out + '</div>';
  }
  function meldsHTML(p, size) {
    var out = '';
    // 亮出的花牌单独一组（虚线框），一眼能数清
    if (p.flowers && p.flowers.length) {
      out += '<div class="meld hua-meld">' +
        p.flowers.map(function (k) { return tileHTML(k, size || 'xs'); }).join('') + '</div>';
    }
    if (p.melds.length) {
      out += p.melds.map(function (m) {
        return '<div class="meld">' + m.tiles.map(function (k) { return tileHTML(k, size || 'xs'); }).join('') + '</div>';
      }).join('');
    }
    return out ? '<div class="melds">' + out + '</div>' : '';
  }
  function riverHTML(p, vertical) {
    if (!p.river.length) return '';
    var lastKind = state.last && state.last.p === p.i ? state.last.k : null;
    var lastIdx = lastKind ? p.river.lastIndexOf(lastKind) : -1;
    return '<div class="river' + (vertical ? ' v' : '') + '">' + p.river.map(function (k, i) {
      return discardHTML(k, i === p.river.length - 1 && lastKind && i >= lastIdx);
    }).join('') + '</div>';
  }

  function render() {
    if (!state) return;
    var me = state.players[0], right = state.players[1], top = state.players[2], left = state.players[3];

    // 对家
    $('seatTop').innerHTML =
      pinfoHTML(top, true) +
      meldsHTML(top) +
      backsHTML(top.hand.length) +
      riverHTML(top);

    // 左右
    $('seatLeft').innerHTML = pinfoHTML(left, true) + backsHTML(left.hand.length, true) + riverHTML(left, true) + meldsHTML(left);
    $('seatRight').innerHTML = pinfoHTML(right, true) + backsHTML(right.hand.length, true) + riverHTML(right, true) + meldsHTML(right);

    // 中央
    var hint = '';
    if (state.over) hint = '本局结束';
    else if (state.turn === 0) hint = '轮到你出牌';
    else hint = NAMES[state.turn] + ' 正在想…';
    var lastTile = state.last ? state.last.k : '';
    $('centerBox').innerHTML =
      '<div class="center-box">' +
        '<div class="wall">牌墙剩 <b>' + state.wall.length + '</b> 张</div>' +
        '<div class="lastbig">' + (lastTile ? tileHTML(lastTile, 'sm') : '<span class="hint">等出牌</span>') + '</div>' +
        '<div class="hint">' + hint + '</div>' +
      '</div>';

    // 自己
    var handHTML = me.hand.map(function (t, i) {
      var can = state.turn === 0 && (state.phase === 'human-discard' || state.phase === 'human-self');
      var isNew = state.justDrew && state.justDrew.u === t.u;
      return '<button class="tile ' + faceOf(t.k).cls + (can ? ' can' : '') + (isNew ? ' isnew' : '') + '"' +
        ' data-hand="' + i + '" aria-label="' + t.k + '"><b>' + (t.k[0] === 'z' ? ZI[Number(t.k.slice(1)) - 1] : t.k.slice(1)) + '</b>' +
        (t.k[0] === 'z' ? '' : '<i>' + SUIT_CN[t.k[0]] + '</i>') + '</button>';
    }).join('');
    $('seatMe').innerHTML =
      riverHTML(me) +
      meldsHTML(me, 'sm') +
      '<div class="hand">' + handHTML + '</div>' +
      '<div class="tipbar">' + tipText() + '</div>';

    $('roundTxt').textContent = '东风 · 第 ' + state.round + ' 局';
    renderActions();
  }

  function tipText() {
    if (state.over) return '点击「再来一局」继续';
    if (state.phase === 'human-claim') return '可以碰杠胡，选一个动作';
    if (state.turn === 0 && state.phase === 'human-discard') {
      var so = state.players[0] && selfOptionsOf(state.players[0]);
      if (so && so.noRight) return '牌型已成但无胡牌权：需门清或 4 张硬花（大胡不限）';
    }
    var waits = tingList(state.players[0]);
    var tingTxt = waits.length ? ' · 听 ' + waits.slice(0, 6).map(kindName).join('、') : '';
    if (state.turn !== 0) return '等待 ' + NAMES[state.turn] + ' 出牌' + tingTxt;
    return waits.length ? '听 ' + waits.slice(0, 6).map(kindName).join('、') + '，点一张牌打出' : '点一张牌打出';
  }
  function kindName(k) {
    if (k[0] === 'z') return ZI[Number(k.slice(1)) - 1];
    return k.slice(1) + SUIT_CN[k[0]];
  }

  /* ---------------- 听牌提示 ---------------- */
  function tingList(p) {
    var out = [];
    var meldCount = p.melds.length;
    var base = handKinds(p);
    var need = 13 - meldCount * 3;
    if (base.length === need + 1) {
      // 刚摸完 14 张：按「打掉刚摸的那张」来提示听什么
      var drew = state.justDrew && state.justDrew.k;
      base = base.slice();
      var at = drew ? base.lastIndexOf(drew) : -1;
      base.splice(at >= 0 ? at : base.length - 1, 1);
    }
    if (base.length !== need) return out;
    for (var i = 0; i < KINDS.length; i++) {
      var k = KINDS[i];
      if (canWin(base.concat([k]), meldCount)) out.push(k);
    }
    return out;
  }

  /* ---------------- 动作栏 ---------------- */
  var actTimer = null;
  function renderActions() {
    var box = $('actions');
    if (state.over) {
      box.innerHTML = '<button class="act" data-act="again">再来一局</button>';
      return;
    }
    if (state.phase === 'human-claim' && state.claim) {
      var c = state.claim;
      var btns = [];
      if (c.options.indexOf('hu') >= 0) btns.push('<button class="act hu" data-act="do-hu">胡</button>');
      if (c.options.indexOf('gang') >= 0) btns.push('<button class="act" data-act="do-gang">杠</button>');
      if (c.options.indexOf('peng') >= 0) btns.push('<button class="act" data-act="do-peng">碰</button>');
      btns.push('<button class="act ghost" data-act="do-pass">过</button>');
      box.innerHTML = btns.join('');
      clearTimeout(actTimer);
      actTimer = setTimeout(function () {
        if (state.phase === 'human-claim') doPass();
      }, 9000);
      return;
    }
    clearTimeout(actTimer);
    if (state.phase === 'human-self' && state.selfOptions) {
      var b2 = [];
      if (state.selfOptions.hu) b2.push('<button class="act hu" data-act="self-hu">自摸</button>');
      if (state.selfOptions.angang) b2.push('<button class="act" data-act="self-gang">暗杠<span class="sub">' + kindName(state.selfOptions.angang) + '</span></button>');
      if (state.selfOptions.bugang) b2.push('<button class="act" data-act="self-bugang">补杠<span class="sub">' + kindName(state.selfOptions.bugang) + '</span></button>');
      b2.push('<button class="act ghost" data-act="self-skip">不要</button>');
      box.innerHTML = b2.join('');
      return;
    }
    box.innerHTML = '<span class="tipbar">' + (state.turn === 0 ? '选一张牌打出' : '等待 ' + NAMES[state.turn] + ' 出牌…') + '</span>';
  }

  /* ---------------- 摸牌 / 出牌 ---------------- */
  function drawFor(p) {
    // 补花：摸到花牌亮出后继续摸，直到摸到一张主牌（牌墙摸完则荒庄）
    while (state.wall.length) {
      var t = state.wall.pop();
      if (isHua(t.k)) { p.flowers.push(t.k); continue; }
      p.hand.push(t);
      sortHand(p);
      state.justDrew = t;
      state.gangDraw = false;
      return t;
    }
    drawGame();
    return null;
  }

  function beginTurn(p) {
    if (state.over) return;
    state.turn = p;
    state.claim = null;
    if (p === 0) {
      var t = drawFor(state.players[0]);
      if (state.over) return;
      if (!t) return;
      var so = selfOptionsOf(state.players[0]);
      if (so.hu || so.angang || so.bugang) {
        state.phase = 'human-self';
        state.selfOptions = so;
      } else {
        state.phase = 'human-discard';
        state.selfOptions = null;
      }
      render();
      return;
    }
    state.phase = 'ai';
    render();
    setTimeout(function () {
      if (state.over || state.turn !== p) return;
      var pl = state.players[p];
      var t = drawFor(pl);
      if (!t) return;
      if (canWin(handKinds(pl), pl.melds.length) && hasWinRight(pl, handKinds(pl), pl.melds)) {
        win(p, t.k, null, true);
        return;
      }
      // 暗杠 / 补杠
      var g = selfOptionsOf(pl);
      if (g.angang && Math.random() < 0.75) { doGang(p, g.angang, 'angang'); return; }
      if (g.bugang && Math.random() < 0.7) { doGang(p, g.bugang, 'bugang'); return; }
      setTimeout(function () { aiDiscard(p); }, 420 + Math.random() * 260);
    }, 320 + Math.random() * 200);
  }

  function selfOptionsOf(p) {
    var out = { hu: false, angang: '', bugang: '', noRight: false };
    var kinds = handKinds(p);
    var can = canWin(kinds, p.melds.length);
    // 牌型已经胡了，但小胡要门清或 4 张硬花，否则没有胡牌权
    out.noRight = can && !hasWinRight(p, kinds, p.melds);
    out.hu = can && !out.noRight;
    var c = countsOf(kinds);
    for (var i = 0; i < 34; i++) if (c[i] === 4) { out.angang = kindOf(i); break; }
    for (var j = 0; j < p.melds.length; j++) {
      var m = p.melds[j];
      if (m.type === 'peng' && c[idx(m.tiles[0])] >= 1) { out.bugang = m.tiles[0]; break; }
    }
    return out;
  }

  function aiDiscard(p) {
    var pl = state.players[p];
    var pick = pickDiscard(pl);
    doDiscard(p, pick);
  }

  /** AI 出牌：打分最低的先打 */
  function pickDiscard(p) {
    var c = countsOf(handKinds(p));
    var best = 0, bestScore = 1e9;
    for (var i = 0; i < p.hand.length; i++) {
      var k = p.hand[i].k;
      var s = usefulness(k, c, p);
      if (s < bestScore) { bestScore = s; best = i; }
    }
    return best;
  }
  function usefulness(k, c, p) {
    var i = idx(k), n = c[i];
    var s = 0;
    if (n >= 3) s += 120;
    else if (n === 2) s += 55;
    if (isHonor(k)) {
      s += n >= 2 ? 30 : -6;
      return s;
    }
    var base = i - (i % 9);
    for (var d = -2; d <= 2; d++) {
      if (!d) continue;
      var j = i + d;
      if (j < base || j > base + 8) continue;
      if (c[j]) s += Math.abs(d) === 1 ? 16 : 7;
    }
    if ((i % 9 === 0) || (i % 9 === 8)) s -= 3;
    return s;
  }

  function doDiscard(p, handIndex) {
    var pl = state.players[p];
    if (!pl || handIndex < 0 || handIndex >= pl.hand.length) return;
    if (state.over) return;
    var t = pl.hand.splice(handIndex, 1)[0];
    sortHand(pl);
    pl.river.push(t.k);
    state.last = { p: p, k: t.k };
    state.justDrew = null;
    state.phase = 'wait';
    state.turn = p;
    render();
    resolveClaims(p, t.k);
  }

  /* ---------------- 碰杠胡的争牌处理 ---------------- */
  function nextSeat(p) { return (p + 1) % 4; }

  /** 争牌队列：胡 > 杠/碰，同级按离出牌者的远近（南京麻将不吃牌） */
  function resolveClaims(from, k) {
    if (state.over) return;
    if (isHua(k)) { beginTurn(nextSeat(from)); return; } // 花牌不可能出现在牌河，兜底
    var q = [];
    for (var d = 1; d <= 3; d++) {
      var who = (from + d) % 4;
      var pl = state.players[who];
      var kinds = handKinds(pl);
      var c = countsOf(kinds);
      var item = {
        p: who,
        dist: d,
        hu: canWin(kinds.concat([k]), pl.melds.length) &&
          hasWinRight(pl, kinds.concat([k]), pl.melds),
        gang: c[idx(k)] === 3,
        peng: c[idx(k)] >= 2,
      };
      if (item.hu || item.gang || item.peng) q.push(item);
    }
    if (!q.length) {
      setTimeout(function () { beginTurn(nextSeat(from)); }, 260);
      return;
    }
    state.claimQueue = q;
    state.claimFrom = from;
    state.claimKind = k;
    processClaims();
  }

  function finishClaims() {
    var from = state.claimFrom;
    state.claimQueue = null;
    state.claimFrom = null;
    state.claimKind = null;
    state.claim = null;
    state.phase = 'wait';
    setTimeout(function () { if (!state.over) beginTurn(nextSeat(from)); }, 260);
  }

  function processClaims() {
    if (state.over) return;
    var q = state.claimQueue;
    var k = state.claimKind;
    var from = state.claimFrom;
    if (!q || !q.length) { finishClaims(); return; }

    // 1) 胡：最靠前的一家
    var huC = q.filter(function (c) { return c.hu; })[0];
    if (huC) {
      if (huC.p === 0) {
        state.claim = { from: from, k: k, options: ['hu'] };
        state.phase = 'human-claim';
        render();
        return;
      }
      q.length = 0;
      win(huC.p, k, from, false);
      return;
    }

    // 2) 杠 / 碰
    var bigC = q.filter(function (c) { return c.gang || c.peng; })[0];
    if (bigC) {
      if (bigC.p === 0) {
        var opts = [];
        if (bigC.gang) opts.push('gang');
        opts.push('peng');
        state.claim = { from: from, k: k, options: opts };
        state.phase = 'human-claim';
        render();
        return;
      }
      if (bigC.gang) {
        q.length = 0;
        doGang(bigC.p, k, 'ming', from);
        return;
      }
      if (wantPeng(bigC.p, k)) {
        q.length = 0;
        doPeng(bigC.p, k, from);
        return;
      }
      q.splice(q.indexOf(bigC), 1);
      setTimeout(processClaims, 120);
      return;
    }

    finishClaims();
  }

  function wantPeng(p, k) {
    var pl = state.players[p];
    var c = countsOf(handKinds(pl));
    var pairs = 0;
    for (var i = 0; i < 34; i++) if (c[i] >= 2) pairs++;
    if (isHonor(k)) return true;
    return pairs >= 3 || Math.random() < 0.55;
  }

  /* ---------------- 执行副露 ---------------- */
  function takeFromHand(pl, kind, n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      for (var j = 0; j < pl.hand.length; j++) {
        if (pl.hand[j].k === kind) { out.push(pl.hand.splice(j, 1)[0].k); break; }
      }
    }
    return out;
  }

  function doPeng(p, k, from) {
    var pl = state.players[p];
    var got = takeFromHand(pl, k, 2);
    if (got.length < 2) return;
    pl.melds.push({ type: 'peng', tiles: [k, k, k], from: from });
    removeRiverTile(from, k);
    state.last = null;
    state.turn = p;
    state.phase = 'ai';
    render();
    setTimeout(function () { if (!state.over) afterMeldDiscard(p); }, 380);
  }

  function removeRiverTile(from, k) {
    var r = state.players[from].river;
    var i = r.lastIndexOf(k);
    if (i >= 0) r.splice(i, 1);
  }

  /** 碰杠后由该家出牌（AI 自动，人类进入出牌阶段） */
  function afterMeldDiscard(p) {
    if (state.over) return;
    state.turn = p;
    if (p === 0) {
      state.phase = 'human-discard';
      render();
      return;
    }
    state.phase = 'ai';
    render();
    setTimeout(function () { aiDiscard(p); }, 520 + Math.random() * 260);
  }

  function doGang(p, k, type, from) {
    var pl = state.players[p];
    if (type === 'ming') {
      var got = takeFromHand(pl, k, 3);
      if (got.length < 3) return;
      pl.melds.push({ type: 'minggang', tiles: [k, k, k, k], from: from });
      removeRiverTile(from, k);
    } else if (type === 'angang') {
      var got2 = takeFromHand(pl, k, 4);
      if (got2.length < 4) return;
      pl.melds.push({ type: 'angang', tiles: [k, k, k, k], from: p });
    } else if (type === 'bugang') {
      var mi = -1;
      for (var i = 0; i < pl.melds.length; i++) {
        if (pl.melds[i].type === 'peng' && pl.melds[i].tiles[0] === k) { mi = i; break; }
      }
      if (mi < 0) return;
      var t = takeFromHand(pl, k, 1);
      if (!t.length) return;
      pl.melds[mi] = { type: 'bugang', tiles: [k, k, k, k], from: pl.melds[mi].from };
    }
    state.last = null;
    state.turn = p;
    state.phase = 'wait';
    render();
    setTimeout(function () {
      if (state.over) return;
      var t2 = drawFor(pl);
      if (!t2) return;
      state.gangDraw = true;
      if (canWin(handKinds(pl), pl.melds.length) && hasWinRight(pl, handKinds(pl), pl.melds)) {
        if (p === 0) {
          state.selfOptions = { hu: true, angang: '', bugang: '' };
          state.phase = 'human-self';
          render();
        } else {
          win(p, t2.k, null, true);
        }
        return;
      }
      if (p === 0) {
        state.phase = 'human-self';
        state.selfOptions = selfOptionsOf(pl);
        render();
      } else {
        setTimeout(function () { aiDiscard(p); }, 460);
      }
    }, 400);
  }

  /* ---------------- 结算 ---------------- */
  function win(p, tileKind, fromP, selfDraw) {
    if (state.over) return;
    var pl = state.players[p];
    var hand = handKinds(pl);
    if (!selfDraw) hand = hand.concat([tileKind]);
    var sc = scoreOf({
      hand: hand,
      melds: pl.melds,
      selfDraw: selfDraw,
      gangDraw: state.gangDraw,
      wallLeft: state.wall.length,
      flowerCount: pl.flowers.length,
    });
    var delta = sc.flowers;
    var detail = [];
    if (selfDraw) {
      for (var i = 0; i < 4; i++) {
        if (i === p) continue;
        state.players[i].score -= delta;
        detail.push(NAMES[i] + ' -' + delta);
      }
      pl.score += delta * 3;
    } else {
      state.players[fromP].score -= delta * 3;
      pl.score += delta * 3;
      detail.push(NAMES[fromP] + ' -' + delta * 3 + '（包三家）');
    }
    pl.hand = hand.map(function (k) { return newTile(k); });
    pl.melds = pl.melds;
    state.over = true;
    state.phase = 'over';
    state.turn = p;
    if (!selfDraw) {
      removeRiverTile(fromP, tileKind);
      pl.river.push(tileKind);
      state.last = { p: fromP, k: tileKind };
    }
    render();
    showResult(p, sc, selfDraw, fromP, hand);
  }

  function drawGame() {
    state.over = true;
    state.phase = 'over';
    render();
    $('ovPanel').innerHTML =
      '<h2>荒庄</h2><p class="sub">牌墙摸完了，本局不输不赢</p>' +
      '<div class="btns"><button class="act" data-act="again">再来一局</button>' +
      '<button class="act ghost" data-act="close-ov">看看牌桌</button></div>';
    $('ov').classList.add('show');
  }

  function showResult(p, sc, selfDraw, fromP, hand) {
    var meWin = p === 0;
    var rows = sc.list.map(function (x) {
      return '<div class="fanrow"><span>' + x.name + '</span><b>+' + x.n + ' 花</b></div>';
    }).join('');
    var title = meWin ? (selfDraw ? '自摸！' : '胡了！') : NAMES[p] + (selfDraw ? ' 自摸' : ' 胡了');
    var sub = selfDraw ? '三家各付 ' + sc.flowers + ' 花' : NAMES[fromP] + ' 点炮，包三家 ' + sc.flowers * 3 + ' 花';
    $('ovPanel').innerHTML =
      '<h2>' + title + '</h2><p class="sub">' + sub + '</p>' +
      '<div class="handrow">' + hand.map(function (k) { return tileHTML(k, 'xs'); }).join('') + '</div>' +
      '<div class="fanlist">' + rows +
        '<div class="fanrow total"><span>合计</span><b>' + sc.flowers + ' 花</b></div>' +
      '</div>' +
      '<table class="scoreboard">' + state.players.map(function (pl) {
        return '<tr><td>' + pl.name + (pl.i === p ? ' 🏆' : '') + '</td><td class="' + (pl.score >= 0 ? 'pos' : 'neg') + '">' +
          (pl.score >= 0 ? '+' : '') + pl.score + '</td></tr>';
      }).join('') + '</table>' +
      '<div class="btns"><button class="act" data-act="again">再来一局</button>' +
      '<button class="act ghost" data-act="close-ov">看看牌桌</button></div>';
    $('ov').classList.add('show');
  }

  /* ---------------- 人类操作 ---------------- */
  function humanDiscard(handIndex) {
    if (state.phase !== 'human-discard' && state.phase !== 'human-self') return;
    state.selfOptions = null;
    doDiscard(0, handIndex);
  }

  function doPass() {
    clearTimeout(actTimer);
    if (!state.claim) return;
    var c = state.claim;
    state.claim = null;
    state.phase = 'wait';
    if (state.claimQueue) {
      state.claimQueue = state.claimQueue.filter(function (x) { return x.p !== 0; });
    }
    // 自己不要，看看后面还有没有别家要
    setTimeout(function () { if (!state.over) processClaims(); }, 120);
  }

  function humanClaim(type, arg) {
    var c = state.claim;
    if (!c) return;
    clearTimeout(actTimer);
    state.claim = null;
    if (type === 'hu') { win(0, c.k, c.from, false); return; }
    if (type === 'peng') { doPeng(0, c.k, c.from); return; }
    if (type === 'gang') { doGang(0, c.k, 'ming', c.from); return; }
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act],[data-hand]') : null;
    if (!t) return;
    if (t.dataset.hand !== undefined && t.dataset.hand !== '') {
      humanDiscard(Number(t.dataset.hand));
      return;
    }
    var act = t.dataset.act;
    if (act === 'do-hu') return humanClaim('hu');
    if (act === 'do-peng') return humanClaim('peng');
    if (act === 'do-gang') return humanClaim('gang');
    if (act === 'do-pass') return doPass();
    if (act === 'self-hu') {
      var me = state.players[0];
      var t0 = state.justDrew ? state.justDrew.k : handKinds(me)[handKinds(me).length - 1];
      win(0, t0, null, true);
      return;
    }
    if (act === 'self-gang' || act === 'self-bugang') {
      var k = act === 'self-gang' ? state.selfOptions.angang : state.selfOptions.bugang;
      doGang(0, k, act === 'self-gang' ? 'angang' : 'bugang');
      return;
    }
    if (act === 'self-skip') {
      state.phase = 'human-discard';
      state.selfOptions = null;
      render();
      return;
    }
    if (act === 'again') { restart(); return; }
    if (act === 'close-ov') { $('ov').classList.remove('show'); return; }
    if (act === 'rules') { showRules(); return; }
  });

  function restart() {
    $('ov').classList.remove('show');
    var scores = state.players.map(function (p) { return p.score; });
    var round = (state.round || 1) + 1;
    newGame();
    state.players.forEach(function (p, i) { p.score = scores[i]; });
    state.round = round;
    render();
    setTimeout(function () { beginTurn(0); }, 300);
  }

  function showRules() {
    $('ovPanel').innerHTML =
      '<h2>南京麻将 · 玩法</h2><p class="sub">本地桌简化版，144 张 · 带花 · 不吃</p>' +
      '<div class="rules">' +
        '<h3>牌张（144 张）</h3><ul>' +
        '<li>万 / 条 / 筒 1-9 各 4 张，共 108 张</li>' +
        '<li>东南西北各 4 张，共 16 张</li>' +
        '<li>硬花 20 张：春、夏、秋、冬、梅、兰、竹、菊各 1 张，红中 / 发财 / 白板各 4 张</li>' +
        '<li>庄家 14 张先手，其余各 13 张</li></ul>' +
        '<h3>不吃，只碰杠</h3><ul>' +
        '<li>没有吃牌，上家打出的牌也只能碰、杠或胡</li>' +
        '<li>碰 / 明杠：任意一家打出</li>' +
        '<li>暗杠、补杠：自己回合内进行，杠后从牌尾补一张</li></ul>' +
        '<h3>补花</h3><ul><li>摸到硬花（含中发白）立即亮出，再从牌尾补一张，补到不是花为止</li>' +
        '<li>发牌时摸到硬花也直接亮出补牌；硬花不参与胡牌牌型，也不能碰、不能杠</li></ul>' +
        '<h3>胡牌权</h3><ul><li>成小胡要有胡牌权：门清，或手上亮出 4 张以上硬花</li>' +
        '<li>七对、对对胡、清一色、混一色、全球独钓等大胡不受此限</li></ul>' +
        '<h3>胡牌</h3><ul><li>四副面子 + 一对将，或七对（不能有碰杠）</li>' +
        '<li>可以自摸，也可以胡别人点的炮</li></ul>' +
        '<h3>算花（底 20 花）</h3><ul>' +
        '<li>门清 +20、对对胡 +40、混一色 +40、清一色 +60</li>' +
        '<li>七对 +80、豪华七对再加 +80、超豪华 +160</li>' +
        '<li>自摸 +10、杠上开花 +40、海底捞月 +10</li>' +
        '<li>缺一门（万条筒只用两门）+10</li>' +
        '<li>亮出的花牌每张 +2 花</li></ul>' +
        '<h3>结算</h3><ul><li>自摸：其余三家各付花数</li><li>点炮：点炮一家包三家（3 倍花数）</li></ul>' +
      '</div>' +
      '<div class="btns"><button class="act" data-act="close-ov">知道了</button></div>';
    $('ov').classList.add('show');
  }

  $('backBtn').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.href = '/';
  });
  $('ruleBtn').addEventListener('click', showRules);

  /* ---------------- 启动 ---------------- */
  newGame();
  var qs = new URLSearchParams(location.search);
  var sc = qs.get('sharecode');
  if (sc) {
    var link = document.querySelector('a[data-back]');
    if (link) link.href += '?sharecode=' + encodeURIComponent(sc);
  }
  render();
  setTimeout(function () { beginTurn(0); }, 420);

  // 给自动化测试留的钩子
  window.MJ = {
    canWin: canWin,
    scoreOf: scoreOf,
    sevenPairs: sevenPairs,
    isAllTriplets: isAllTriplets,
    newGame: function () { return newGame(); },
    get state() { return state; },
    kindName: kindName,
    tingList: tingList,
    beginTurn: beginTurn,
    doDiscard: doDiscard,
    pickDiscard: pickDiscard,
    isHua: isHua,
    hasWinRight: hasWinRight,
    isBigHu: isBigHu,
    HUA_TOTAL: HUA_TOTAL,
    drawFor: drawFor,
    newTile: newTile,
    HUA_KINDS: HUA_KINDS.slice(),
  };
})();
</script>
</body>
</html>
