<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f4f5f9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="App" />
<meta name="format-detection" content="telephone=no" />
<title>App</title>
<link rel="icon" id="appIcon" href="/api/brand/icon" />
<link rel="apple-touch-icon" sizes="180x180" id="appleIcon" href="/api/brand/icon.png?size=180&mode=bleed" />
<link rel="manifest" id="manifestLink" href="/manifest.webmanifest" />
<!-- iOS 启动图：常见机型逐个声明，由 /api/brand/splash 按需生成 -->
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/api/brand/splash?w=1290&h=2796" />
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/api/brand/splash?w=1179&h=2556" />
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/api/brand/splash?w=1284&h=2778" />
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/api/brand/splash?w=1170&h=2532" />
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/api/brand/splash?w=828&h=1792" />
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/api/brand/splash?w=750&h=1334" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="topbar-title" id="topbarTitle">首页</span>
        <span class="topbar-brand" id="topbarBrand">
          <span class="brand-logo" id="brandLogo">A</span>
          <span class="brand-name" id="brandName">App</span>
        </span>
      </div>
    </header>

    <main class="view" id="view">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </main>

    <nav class="tabbar" id="tabbar">
      <button class="tab is-active" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-tab="content">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        <span>内容</span>
      </button>
      <button class="tab" data-tab="mine">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <div class="mask" id="mask"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  <div class="toast" id="toast"></div>

  <script src="/native.js"></script>
  <script src="/app.js"></script>
</body>
</html>
