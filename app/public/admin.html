<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>管理后台 · 手机App支付骨架</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:," />
<style>
  :root { --bg:#f3f5f9; --card:#fff; --line:#e6e9f0; --ink:#1b2130; --sub:#6b7280; --brand:#4f6ef7; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; font-size:14px; -webkit-text-size-adjust:100%; }
  .wrap { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
  /* 输入框：确保在任何环境下都能获得焦点与选中 */
  input, select, textarea { -webkit-user-select:text; user-select:text; touch-action:manipulation; }
  input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,110,247,.12); }
  /* 登录 */
  .login-card { max-width:360px; margin:12vh auto 0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; box-shadow:0 8px 24px rgba(20,30,60,.06); }
  .login-logo { width:52px; height:52px; border-radius:16px; background:linear-gradient(135deg,#6b8bff,#4f6ef7); color:#fff; font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .login-card h2 { margin:0 0 4px; font-size:19px; text-align:center; }
  .login-card p { margin:0 0 18px; color:var(--sub); font-size:12.5px; text-align:center; }
  .login-card input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; margin-bottom:12px; }
  .login-card button { width:100%; padding:11px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:15px; cursor:pointer; }
  .login-card button:disabled { opacity:.6; }
  /* 布局：桌面侧边栏 + 内容区 */
  .shell { display:grid; grid-template-columns:210px 1fr; gap:18px; align-items:start; }
  .side { position:sticky; top:16px; display:flex; flex-direction:column; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 12px; min-height:calc(100vh - 56px); box-shadow:0 4px 18px rgba(20,30,60,.05); }
  .side-brand { display:flex; gap:10px; align-items:center; padding:4px 6px 12px; border-bottom:1px solid var(--line); }
  .side-logo { width:38px; height:38px; flex:none; border-radius:12px; background:linear-gradient(135deg,#6b8bff,#4f6ef7); color:#fff; font-size:19px; display:flex; align-items:center; justify-content:center; }
  .side-brand-txt { min-width:0; }
  .side-brand-txt b { display:block; font-size:14.5px; }
  .side-brand-txt i { display:block; font-style:normal; font-size:11.5px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-nav { display:flex; flex-direction:column; gap:2px; }
  .nav-btn { display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13.5px; color:var(--sub); text-align:left; transition:background .15s,color .15s; white-space:nowrap; }
  .nav-btn .ic { width:20px; text-align:center; flex:none; }
  .nav-btn:hover { background:#f3f5fb; color:var(--ink); }
  .nav-btn.on { background:linear-gradient(135deg,#6b8bff,#4f6ef7); color:#fff; font-weight:600; box-shadow:0 4px 12px rgba(79,110,247,.3); }
  .side-foot { margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; }
  .side-foot button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 10px; cursor:pointer; font-size:12.5px; color:var(--bad); }
  .side-foot button:hover { background:#fdf3f3; }
  .main { min-width:0; }
  /* 统计 */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:#f8f9fc; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .stat-ic { font-size:17px; margin-bottom:4px; }
  .stat .k { color:var(--sub); font-size:12px; }
  .stat .v { font-size:20px; font-weight:700; margin-top:4px; }
  .stat .v small { font-size:12px; font-weight:400; color:var(--sub); }
  .stat.hl-brand { background:linear-gradient(160deg,#eef2ff,#f8f9fc); border-color:#dfe6ff; }
  .stat.hl-brand .v { color:var(--brand); }
  .stat.hl-ok .v { color:var(--ok); }
  .stat.hl-bad .v { color:var(--bad); }
  .stat.hl-warn { background:#fffaf0; border-color:#f5e4c3; }
  .stat.hl-warn .v { color:var(--warn); }
  /* 订单页统计条 / 筛选 chips（此前缺失的样式） */
  .ostat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
  .ostat { background:#f8f9fc; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .ostat b { display:block; font-size:18px; }
  .ostat span { color:var(--sub); font-size:12px; }
  .ostat.warn { background:#fffaf0; border-color:#f5e4c3; }
  .ostat.warn b { color:var(--warn); }
  .ochips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .ochip { border:1px solid #dde2ec; background:#fff; border-radius:999px; padding:5px 12px; font-size:12.5px; color:var(--ink); cursor:pointer; font-family:inherit; }
  .ochip i { font-style:normal; color:var(--sub); font-size:11px; }
  .ochip.on { border-color:var(--brand); color:var(--brand); background:rgba(79,110,247,.06); font-weight:600; }
  .opager { display:flex; align-items:center; gap:12px; margin-top:12px; }
  .opager .op[disabled] { opacity:.45; cursor:not-allowed; }
  .ochip-sep { width:1px; height:16px; background:var(--line); margin:0 4px; }
  /* 搜索框（订单/用户/会员/商品/内容页共用） */
  .osearch, .search-box { display:flex; gap:8px; margin-bottom:12px; }
  .osearch input, .search-box input { flex:1; min-width:0; padding:9px 12px; border:1px solid var(--line); border-radius:10px; font-size:13.5px; font-family:inherit; }
  .osearch input:focus, .search-box input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,110,247,.12); }
  .search-none { padding:14px 4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .card h3 { margin:0 0 12px; font-size:14.5px; }
  /* 统计 */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:#f8f9fc; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .stat .k { color:var(--sub); font-size:12px; }
  .stat .v { font-size:20px; font-weight:700; margin-top:4px; }
  .stat .v small { font-size:12px; font-weight:400; color:var(--sub); }
  /* 表格 */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--sub); font-weight:500; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px 8px; border-bottom:1px solid #f0f2f7; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  .tag { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11.5px; }
  .tag.paid { background:#e7f6ec; color:var(--ok); }
  .tag.created,.tag.pending { background:#fdf3e3; color:var(--warn); }
  .tag.refunded { background:#eceafe; color:#6d5bd0; }
  .tag.closed { background:#eef0f4; color:var(--sub); }
  .tag.off { background:#fdeaea; color:var(--bad); }
  .tag.tag-green { background:#e7f6ec; color:var(--ok); }
  .tag.tag-orange { background:#fdf3e3; color:var(--warn); }
  .tag.on { background:#e7f6ec; color:var(--ok); }
  .tag.tag-blue { background:#e8f0ff; color:#2b6cf0; }
  .tag.tag-gold { background:#fdf3dd; color:#a06a10; }
  .tag.tag-green { background:#e7f6ec; color:var(--ok); }
  .muted { color:var(--sub); }
  .op { border:1px solid var(--line); background:#fff; border-radius:7px; padding:4px 10px; font-size:12px; cursor:pointer; margin-right:6px; }
  .op.danger { color:var(--bad); border-color:#f3c1c1; }
  .op:hover { background:#f6f7fb; }
  /* 商品表单 */
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .form-grid label { font-size:12px; color:var(--sub); display:block; margin-bottom:4px; }
  .form-grid input,.form-grid select,.form-grid textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; font-family:inherit; }
  .form-grid textarea { resize:vertical; line-height:1.5; }
  .c-preview { margin-top:12px; }
  .c-preview img { max-width:180px; max-height:180px; border-radius:12px; border:1px solid var(--line); display:block; }
  .prod-preview { margin-top:10px; }
  .prod-preview img { max-width:150px; max-height:150px; border-radius:12px; border:1px solid var(--line); display:block; object-fit:cover; }
  .form-grid .full { grid-column:1 / -1; }

  /* 首页展示配置：服务保障条逐行编辑 */
  .sub-head {
    display:flex; align-items:center; justify-content:space-between;
    margin:18px 0 4px; padding-top:14px;
    border-top:1px dashed #eef0f4;
  }
  .sub-head b { font-size:13.5px; }
  .mini-switch { font-size:12.5px; color:var(--sub); display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
  .trust-edit {
    display:grid;
    grid-template-columns:56px 1fr 1fr 62px;
    gap:8px; align-items:center;
    margin-bottom:8px;
  }
  .trust-edit input[type="text"],
  .trust-edit input:not([type]) {
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:9px;
    font-size:13px; font-family:inherit;
  }
  .trust-edit .t-icon { text-align:center; padding-left:4px; padding-right:4px; }
  .t-on-wrap { font-size:12px; color:var(--sub); display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  @media (max-width:640px){
    .trust-edit { grid-template-columns:48px 1fr 1fr; }
    .t-on-wrap { grid-column:1 / -1; }
  }
  .btn { padding:10px 18px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:14px; cursor:pointer; }
  .btn:disabled { opacity:.6; }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .row-actions { display:flex; gap:8px; margin-top:12px; }
  .toast { position:fixed; left:50%; bottom:36px; transform:translateX(-50%); background:#1b2130; color:#fff; padding:9px 18px; border-radius:99px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:99; }
  .toast.show { opacity:.95; }
  .check-item { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .cfg-row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed #eef0f4; font-size:13px; gap:12px; }
  .cfg-row b { font-weight:600; word-break:break-all; text-align:right; }
  /* 外观页 */
  label.btn { display:inline-block; cursor:pointer; text-align:center; line-height:1.35; }
  .brand-row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .brand-preview { width:88px; height:88px; border-radius:22px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#eef1f8; border:1px solid var(--line); font-size:34px; font-weight:600; color:#fff; flex:0 0 auto; }
  .brand-preview.is-default { background:linear-gradient(135deg,#6b8bff,#4f6ef7); border-color:transparent; }
  .brand-preview img { width:100%; height:100%; object-fit:cover; display:block; }
  .brand-pick { min-width:0; }
  .brand-btns { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mock-app { max-width:300px; margin:0 auto; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#f7f8fc; }
  .mock-top { display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border-bottom:1px solid var(--line); }
  .mock-logo { width:24px; height:24px; border-radius:7px; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff; flex:0 0 auto; }
  .mock-logo.is-default { background:linear-gradient(135deg,#6b8bff,#4f6ef7); }
  .mock-logo img { width:100%; height:100%; object-fit:cover; display:block; }
  .mock-name { font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mock-body { padding:14px 12px 18px; }
  .mock-greet { font-size:11.5px; color:var(--sub); }
  .mock-hero { font-size:15px; font-weight:600; margin:6px 0 12px; }
  .mock-line { height:8px; border-radius:99px; background:#e6eaf3; margin-bottom:8px; }
  .mock-line.w70 { width:70%; }
  .pv-wrap { display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
  .pv-phone { width:340px; max-width:100%; flex:none; border:1px solid var(--line); border-radius:26px; padding:10px; background:#fff; box-shadow:0 8px 28px rgba(15,23,42,.08); }
  .pv-phone iframe { display:block; width:100%; height:600px; border:0; border-radius:18px; background:#f7f8fc; }
  .pv-side { flex:1; min-width:240px; display:flex; flex-direction:column; gap:10px; }
  .pv-tips { border:1px dashed var(--line); border-radius:12px; padding:12px 14px; background:#fafbff; }
  .pv-tips b { font-size:13px; }
  .pv-tips p { margin:6px 0 0; font-size:12.5px; color:var(--sub); line-height:1.8; }
  .pv-jumps { display:flex; gap:8px; flex-wrap:wrap; }
  .mock-line.w45 { width:45%; }
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;}
    .side{position:static; min-height:0; padding:10px;}
    .side-brand{padding-bottom:8px;}
    .side-nav{flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:2px; -webkit-overflow-scrolling:touch;}
    .nav-btn{flex:0 0 auto; padding:8px 13px;}
    .nav-btn .ic{width:auto;}
    .side-foot{flex-direction:row; justify-content:space-between; align-items:center;}
    .side-foot .muted{max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  }
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} .stats{grid-template-columns:repeat(2,1fr);} .ostat-row{grid-template-columns:repeat(2,1fr);} .pv-phone{width:100%;} .pv-phone iframe{height:520px;} }

  /* 卡片标题行：标题 + 右侧操作（导出等） */
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .card-head h3 { margin:0; }
  /* 侧栏未处理角标 */
  .nav-badge {
    margin-left:auto; min-width:18px; height:18px; padding:0 5px;
    border-radius:999px; background:#ef4444; color:#fff;
    font-size:11px; line-height:18px; text-align:center; font-weight:600;
  }
  /* 反馈列表 */
  .fb-item { padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:#fafbff; margin-bottom:10px; }
  .fb-head { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11.5px; margin-bottom:6px; }
  .fb-status { padding:2px 8px; border-radius:999px; background:#fdf3e3; color:var(--warn); font-size:11px; font-weight:600; }
  .fb-status.done { background:#e7f6ec; color:var(--ok); }
  .fb-body { font-size:13.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
  .fb-reply { margin-top:9px; padding:9px 11px; border-radius:9px; background:#eef3ff; font-size:12.5px; line-height:1.65; color:#2f3a56; white-space:pre-wrap; word-break:break-word; }
  .fb-reply b { display:block; font-size:11.5px; color:var(--brand); margin-bottom:3px; }
  .fb-text { width:100%; margin-top:10px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; font-size:13px; font-family:inherit; line-height:1.6; resize:vertical; background:#fff; color:var(--ink); }
  .fb-text:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,110,247,.12); }
  @media (max-width:860px){ .nav-badge { margin-left:6px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="./admin.js?v=20261105i"></script>
</body>
</html>
